[package]
name = "nyx-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nyx team server: HTTP beacon listener, session registry, task queue, control API"

[dependencies]
nyx-protocol = { workspace = true }
nyx-profile = { workspace = true }
nyx-scripting = { workspace = true }
nyx-scripting-rhai = { workspace = true }
# Fingerprint engine (inbound JA3/JA4 computation). pure Rust.
nyx-transport = { workspace = true }
# Persistent credential store (SQLite/ACID, server-side only).
nyx-store = { workspace = true }
# Named-operator auth (argon2) + audit-log hash-chain.
argon2 = "0.5"
sha2 = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
dashmap = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }

[dev-dependencies]
nyx-agent-dev = { workspace = true }
nyx-scripting = { workspace = true }
ureq = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"

[[bin]]
name = "nyx-server"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
