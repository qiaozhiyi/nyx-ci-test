[package]
name = "nyx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nyx operator TUI — opencode-style fullscreen client over the team server REST API."

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "net", "io-util", "signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
nyx-parse = { workspace = true }
nyx-rest = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.28"
crossterm = "0.28"

[[bin]]
name = "nyx-cli"
path = "src/main.rs"
