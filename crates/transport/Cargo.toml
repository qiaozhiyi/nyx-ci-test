[package]
name = "nyx-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nyx transport fingerprint engine: TLS ClientHello parse + JA3/JA4 + HTTP/2 (Akamai) fingerprints + fingerprint emission seam"

[dependencies]
md-5 = "0.10"
sha2 = { workspace = true }
hex = { workspace = true }
ureq = { workspace = true }
rand = { workspace = true, features = ["std", "std_rng"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tracing = { workspace = true }

[features]
default = []

[dev-dependencies]
md-5 = "0.10"

[lib]
name = "nyx_transport"
path = "src/lib.rs"
