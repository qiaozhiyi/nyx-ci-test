[package]
name = "nyx-client-tauri"
version = "0.1.0"
edition = "2021"
description = "Nyx desktop operator client (Tauri v2 + React)"

[lib]
name = "nyx_client_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[features]
default = []
