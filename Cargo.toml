[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/profile",
    "crates/server",
    "crates/agent-dev",
    "crates/client-cli",
    "crates/scripting",
    "crates/evasion",
    "crates/config",
    "crates/config-macros",
    "crates/coff",
    "crates/transport",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
nyx-protocol = { path = "crates/protocol" }
nyx-profile = { path = "crates/profile" }
nyx-agent-dev = { path = "crates/agent-dev" }
nyx-scripting = { path = "crates/scripting" }
nyx-evasion = { path = "crates/evasion" }
nyx-config = { path = "crates/config" }
nyx-config-macros = { path = "crates/config-macros" }
nyx-coff = { path = "crates/coff" }
nyx-transport = { path = "crates/transport" }
# proc-macro toolchain (compile-time config embedding)
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
# crypto — all no_std-capable so the same code can ship in the PIC implant later
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
rand_core = "0.6"
# server / client
tokio = { version = "1", features = ["full"] }
axum = "0.7"
dashmap = "6"
hex = "0.4"
ureq = { version = "2", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

# Implant builds favour tiny, stripped binaries.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
