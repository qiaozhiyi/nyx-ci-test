name: CI

# Continuous integration for the Nyx framework core crates.
# Runs on every push to main + all PRs. Three gates: test, clippy, fmt.
#
# Scope: workspace crates (server, client-cli, protocol, transport, etc.)
# EXCLUDING nyx-client-ui (Makepad GUI — has its own clippy profile; tracked
# separately) and the standalone non-workspace crates (implant-win,
# operator-kernelsdk, implant-evasionsdk — each has its own [workspace] and
# is verified by g6-verify.yml + manual real-machine testing).
#
# The standalone crates ARE tested in the `standalone` job via their own
# `cargo test --lib` so their 87+53 unit tests are gated too.
#
# Runner: GitHub-hosted windows-latest (Server 2025). The workspace is pure
# Rust with no platform-specific gates in these jobs, so Windows coverage
# stands in for the whole matrix (macOS assertions are covered by local dev
# runs and the cross-target implant checks).
#
# Toolchains: stable + nightly are installed via rustup in each job.
#
# All cargo commands use `shell: cmd` (available on hosted Windows).
#
# Authorized red-team security research project.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workflows run on GitHub-hosted windows-latest. Fork PRs are reviewed before
# a maintainer branch is created, then receive the normal required checks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # MSVC LNK1140/LNK1318 PDB size limit on Windows debug builds. The full
  # debug info for nyx-server (with axum/tokio/rustls/aws-lc-rs) exceeds the
  # 4GB PDB limit. Setting debug=0 skips PDB generation entirely for CI.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # ---- Gate 1: fmt (fastest, fail early) ----
  fmt:
    name: Format
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure stable toolchain + rustfmt
        shell: cmd
        run: rustup toolchain install 1.96.0 --component rustfmt --no-self-update
      - name: cargo fmt --check
        shell: cmd
        run: cargo +1.96.0 fmt --all -- --check

  # ---- Gate 2: clippy on core crates (exclude client-ui Makepad GUI) ----
  clippy:
    name: Clippy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Ensure stable toolchain + clippy
        shell: cmd
        run: rustup toolchain install 1.96.0 --component clippy --no-self-update
      - name: cargo clippy (workspace, excl. client-ui)
        shell: cmd
        run: cargo +1.96.0 clippy --locked --workspace --exclude nyx-client-ui-web --all-targets -- -D warnings

  # ---- Gate 3: workspace tests ----
  # Runs on windows-latest, so the Windows-only named-pipe e2e
  # (tests/smb_pipe_e2e.rs, smb-pipe pivot parent) executes here too — the
  # real-Windows runtime verification of the SMB listener.
  test:
    name: Test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ensure stable toolchain
        shell: cmd
        run: rustup toolchain install 1.96.0 --no-self-update
      - name: cargo test --workspace (excl. client-ui)
        shell: cmd
        run: cargo +1.96.0 test --locked --workspace --exclude nyx-client-ui-web --all-targets

  # ---- Gate 4: standalone crates (each has its own [workspace]) ----
  standalone:
    name: Standalone crate tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Ensure stable toolchain
        shell: cmd
        run: rustup toolchain install 1.96.0 --no-self-update
      - name: operator-kernelsdk lib tests
        shell: cmd
        run: cargo +1.96.0 test --locked --manifest-path crates/operator-kernelsdk/Cargo.toml --lib
      - name: implant-evasionsdk tests
        shell: cmd
        run: cargo +1.96.0 test --locked --manifest-path crates/implant-evasionsdk/Cargo.toml
      - name: minidump-assembler tests (P3.a)
        shell: cmd
        run: cargo +1.96.0 test --locked --manifest-path crates/minidump-assembler/Cargo.toml
      - name: offset-resolver build check (P0.b --fltmgr)
        shell: cmd
        run: cargo +1.96.0 check --locked --manifest-path crates/offset-resolver/Cargo.toml
      - name: operator-kernel-cli build check (P0.a/3.b)
        shell: cmd
        run: cargo +1.96.0 check --locked --manifest-path crates/operator-kernel-cli/Cargo.toml
      # WP-C crate split (2026-08): the implant's four rlib layers
      # (core ← evasion ← net ← tasks) are standalone crates like the rest of
      # this gate. fmt is a hard gate; clippy runs report-only for now — the
      # pre-split implant was never under a clippy gate and carries ~300
      # pre-existing style lints (AH-13 debt recorded, not split regressions).
      - name: Ensure rustfmt + clippy for lint steps
        shell: cmd
        run: rustup component add rustfmt clippy --toolchain 1.96.0
      - name: implant-core check + fmt + clippy (WP-C)
        shell: cmd
        run: |
          cargo +1.96.0 check --locked --manifest-path crates/implant-core/Cargo.toml && ^
          cargo +1.96.0 fmt --manifest-path crates/implant-core/Cargo.toml -- --check && ^
          cargo +1.96.0 clippy --locked --manifest-path crates/implant-core/Cargo.toml || ^
          exit 1
      - name: implant-evasion check + fmt + clippy (WP-C)
        shell: cmd
        run: |
          cargo +1.96.0 check --locked --manifest-path crates/implant-evasion/Cargo.toml && ^
          cargo +1.96.0 fmt --manifest-path crates/implant-evasion/Cargo.toml -- --check && ^
          cargo +1.96.0 clippy --locked --manifest-path crates/implant-evasion/Cargo.toml || ^
          exit 1
      - name: implant-net check + fmt + clippy (WP-C)
        shell: cmd
        run: |
          cargo +1.96.0 check --locked --manifest-path crates/implant-net/Cargo.toml && ^
          cargo +1.96.0 fmt --manifest-path crates/implant-net/Cargo.toml -- --check && ^
          cargo +1.96.0 clippy --locked --manifest-path crates/implant-net/Cargo.toml || ^
          exit 1
      - name: implant-tasks check + fmt + clippy (WP-C)
        shell: cmd
        run: |
          cargo +1.96.0 check --locked --manifest-path crates/implant-tasks/Cargo.toml && ^
          cargo +1.96.0 fmt --manifest-path crates/implant-tasks/Cargo.toml -- --check && ^
          cargo +1.96.0 clippy --locked --manifest-path crates/implant-tasks/Cargo.toml || ^
          exit 1

  # The operator UI is outside the Rust workspace, so it needs an explicit
  # quality gate rather than relying on the workspace jobs above.
  ui-build:
    name: UI build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install locked UI dependencies
        shell: cmd
        working-directory: crates/client-ui-web
        run: npm ci
      - name: Type-check and production build
        shell: cmd
        working-directory: crates/client-ui-web
        run: npm run build

  # ---- Gate 5: headless loader probe (Unicorn emu of the real Layer-1 bytes) ----
  # Runs on ANY host (no Windows needed): executes the LAYER1_BOOTSTRAP bytes in
  # a Unicorn x86-64 emulator and asserts the magic-present handoff and the
  # magic-absent bail contracts. Guards against Layer-1 regressions on every PR.
  loader-emu:
    name: Loader emu probe
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install unicorn + run probe
        run: |
          python3 -m pip install --user -q unicorn
          python3 tools/loader-emu/loader_emu.py
          python3 tools/loader-emu/loader_emu.py --blob tools/loader-emu/fixture/blob.bin

  # ---- Gate 6: implant selftest DLL under Qiling (Windows x86_64 emu) ----
  # Builds the selftest-flavored implant DLL for the Windows GNU target and
  # runs tools/selftest-qiling/runner.py, which loads it under Qiling
  # (Windows/x86_64 emulation) and calls the nyx_selftest_* exports, checking
  # each one's ExitProcess bitmask. Guards the PEB-walk export resolution and
  # the syscall-light selftest modules against regressions on every PR.
  #
  # RUSTFLAGS is cleared: the workflow-level `-D warnings` env is fine for the
  # workspace crates but would fail the standalone nightly no_std build on
  # incidental warnings.
  selftest-qiling:
    name: Implant selftest via Qiling
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      # macos-latest + brew mingw-w64 reproduces the exact toolchain the runner
      # was validated against locally (ubuntu's apt mingw 12 links a different
      # DLL layout that breaks the emulated export walk).
      - name: Install mingw-w64 (Windows GNU linker)
        run: brew install mingw-w64
      - name: Install nightly toolchain + Windows GNU target
        run: rustup toolchain install nightly --target x86_64-pc-windows-gnu --no-self-update
      - name: Build selftest DLL
        run: cargo +nightly build --release --manifest-path crates/implant-win/Cargo.toml --features selftest --target x86_64-pc-windows-gnu
      - name: Install qiling + run selftest matrix
        run: |
          set -e
          # capstone 5.0.1 imports distutils.sysconfig — REMOVED in Python 3.12,
          # intact in 3.11. qiling 1.4.6 requires unicorn>=2.0.1 (leave it to
          # pip). This pins the exact locally-validated environment.
          brew install python@3.11
          /opt/homebrew/opt/python@3.11/bin/python3.11 -m venv /tmp/qiling-venv
          # keystone-engine has no py3.11/arm64 wheel and its source-built
          # dylib fails to load; the runner never assembles, so stub it.
          /tmp/qiling-venv/bin/pip install -q 'setuptools<81' qiling==1.4.6
          KEYSITE=$(/tmp/qiling-venv/bin/python -c "import site; print(site.getsitepackages()[0])")
          mkdir -p "$KEYSITE/keystone"
          cp tools/selftest-qiling/keystone_stub.py "$KEYSITE/keystone/__init__.py"
          /tmp/qiling-venv/bin/python -c "import qiling.arch.x86" 2>&1 || true
          /tmp/qiling-venv/bin/python tools/selftest-qiling/runner.py
      # Production (default-features) build: ~50 selftest exports are
      # feature-gated OUT, so this validates the exact shipped DLL layout —
      # the last of the 6 standalone crates with no dedicated build gate.
      # MUST run AFTER the matrix: both builds write the same DLL path and
      # the production build would strip the selftest exports the runner
      # needs (caught on public CI 2026-08).
      - name: Build production DLL (no selftest exports)
        run: cargo +nightly build --release --manifest-path crates/implant-win/Cargo.toml --target x86_64-pc-windows-gnu
      # B3 bof-host (crates/bof-host): standalone no_std cdylib like Gate 4's
      # crates, but nightly-only (alloc_error_handler is still unstable on
      # stable 1.96.0), so its fmt/check/clippy live in this nightly+mingw
      # job instead of Gate 4.
      - name: bof-host fmt (B3)
        run: cargo +nightly fmt --check --manifest-path crates/bof-host/Cargo.toml
      - name: bof-host check (B3)
        run: cargo +nightly check --manifest-path crates/bof-host/Cargo.toml --target x86_64-pc-windows-gnu
      - name: bof-host clippy (B3)
        run: cargo +nightly clippy --manifest-path crates/bof-host/Cargo.toml --target x86_64-pc-windows-gnu

  # ---- Gate 7: TLS fingerprint emission (impersonation feature) ----
  # The JA3/JA4 *computation* engine (server-side inbound sniffing) is covered
  # by the workspace test job. This gate covers the *emission* side — the
  # BoringSSL-backed wreq client whose ClientHello/HTTP2 frames impersonate a
  # real browser — which is feature-gated and zero-consumer by default:
  #   - compiles nyx-transport + nyx-agent-dev with `impersonation` (BoringSSL
  #     needs cmake/go, both preinstalled on hosted runners),
  #   - runs the live probe that verifies the on-the-wire JA3 hash against a
  #     public TLS-echo service (tls.peet.ws).
  impersonation:
    name: Impersonation emitter
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ensure stable toolchain
        run: rustup toolchain install 1.96.0 --no-self-update
      - name: Build nyx-transport with impersonation
        run: cargo +1.96.0 build --locked -p nyx-transport --features impersonation
      - name: Build nyx-agent-dev with impersonation
        run: cargo +1.96.0 build --locked -p nyx-agent-dev --features impersonation
      - name: Live JA3 emission validation
        run: cargo +1.96.0 test --locked -p nyx-transport --features impersonation -- --ignored validate_ja3_live
