name: CI

# Continuous integration for the Nyx framework core crates.
# Runs on every push to main + all PRs. Three gates: test, clippy, fmt.
#
# Scope: workspace crates (server, client-cli, protocol, transport, etc.)
# EXCLUDING nyx-client-ui (Makepad GUI — has its own clippy profile; tracked
# separately) and the standalone non-workspace crates (implant-win,
# operator-kernelsdk, implant-evasionsdk — each has its own [workspace] and
# is verified by g6-verify.yml + manual real-machine testing).
#
# The standalone crates ARE tested in the `standalone` job via their own
# `cargo test --lib` so their 87+53 unit tests are gated too.
#
# Runner: self-hosted Windows Server 2019 (build 17763). GitHub-hosted
# ubuntu/macos runners were retired after a billing block stopped all
# hosted jobs. macOS coverage is dropped (no Mac self-hosted runner); the
# Linux-equivalent assertions are covered on Windows since the workspace is
# pure Rust with no platform-specific gates in these jobs.
#
# Toolchains: stable + nightly are pre-installed on the runner via rustup.
# We call `rustup` directly instead of dtolnay/rust-toolchain — that action
# requires bash which isn't on the runner service PATH.
#
# All cargo commands use `shell: cmd` to avoid PowerShell 5.1 treating
# cargo's stderr progress ("Compiling...") as a NativeCommandError.
#
# Authorized red-team security research project.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # MSVC LNK1318 PDB LIMIT on Windows when 4 parallel jobs each write ~4GB
  # PDBs to the same target dir. split-debuginfo=off avoids full PDBs.
  CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: "off"
  CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: "off"

jobs:
  # ---- Gate 1: fmt (fastest, fail early) ----
  fmt:
    name: Format
    runs-on: [self-hosted, win-17763]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure stable toolchain + rustfmt
        shell: cmd
        run: rustup toolchain install stable --component rustfmt --no-self-update
      - name: cargo fmt --check
        shell: cmd
        run: cargo +stable fmt --all -- --check

  # ---- Gate 2: clippy on core crates (exclude client-ui Makepad GUI) ----
  clippy:
    name: Clippy
    runs-on: [self-hosted, win-17763]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure stable toolchain + clippy
        shell: cmd
        run: rustup toolchain install stable --component clippy --no-self-update
      - name: cargo clippy (workspace, excl. client-ui)
        shell: cmd
        run: cargo +stable clippy --workspace --exclude nyx-client-ui --all-targets -- -D warnings

  # ---- Gate 3: workspace tests ----
  test:
    name: Test
    runs-on: [self-hosted, win-17763]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure stable toolchain
        shell: cmd
        run: rustup toolchain install stable --no-self-update
      - name: cargo test --workspace (excl. client-ui)
        shell: cmd
        run: cargo +stable test --workspace --exclude nyx-client-ui --all-targets

  # ---- Gate 4: standalone crates (each has its own [workspace]) ----
  standalone:
    name: Standalone crate tests
    runs-on: [self-hosted, win-17763]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure stable toolchain
        shell: cmd
        run: rustup toolchain install stable --no-self-update
      - name: operator-kernelsdk lib tests
        shell: cmd
        run: cargo +stable test --manifest-path crates/operator-kernelsdk/Cargo.toml --lib
      - name: implant-evasionsdk tests
        shell: cmd
        run: cargo +stable test --manifest-path crates/implant-evasionsdk/Cargo.toml
      - name: minidump-assembler tests (P3.a)
        shell: cmd
        run: cargo +stable test --manifest-path crates/minidump-assembler/Cargo.toml
      - name: offset-resolver build check (P0.b --fltmgr)
        shell: cmd
        run: cargo +stable check --manifest-path crates/offset-resolver/Cargo.toml
      - name: operator-kernel-cli build check (P0.a/3.b)
        shell: cmd
        run: cargo +stable check --manifest-path crates/operator-kernel-cli/Cargo.toml
