name: CI

# Continuous integration for the Nyx framework core crates.
# Runs on every push to main + all PRs. Three gates: test, clippy, fmt.
#
# Scope: workspace crates (server, client-cli, protocol, transport, etc.)
# EXCLUDING nyx-client-ui (Makepad GUI — has its own clippy profile; tracked
# separately) and the standalone non-workspace crates (implant-win,
# operator-kernelsdk, implant-evasionsdk — each has its own [workspace] and
# is verified by g6-verify.yml + manual real-machine testing).
#
# The standalone crates ARE tested in the `standalone` job via their own
# `cargo test --lib` so their 87+53 unit tests are gated too.
#
# Runner: self-hosted Windows Server 2019 (build 17763). GitHub-hosted
# ubuntu/macos runners were retired after a billing block stopped all
# hosted jobs. macOS coverage is dropped (no Mac self-hosted runner); the
# Linux-equivalent assertions are covered on Windows since the workspace is
# pure Rust with no platform-specific gates in these jobs.
#
# Toolchains: stable + nightly are pre-installed on the runner via rustup.
# We call `rustup` directly instead of dtolnay/rust-toolchain — that action
# requires bash which isn't on the runner service PATH.
#
# All cargo commands use `shell: cmd` to avoid PowerShell 5.1 treating
# cargo's stderr progress ("Compiling...") as a NativeCommandError.
#
# Authorized red-team security research project.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workflows run on a persistent self-hosted runner. Never execute code from an
# external fork there: fork PRs are reviewed before a maintainer branch is
# created, then receive the normal required checks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # MSVC LNK1140/LNK1318 PDB size limit on Windows debug builds. The full
  # debug info for nyx-server (with axum/tokio/rustls/aws-lc-rs) exceeds the
  # 4GB PDB limit. Setting debug=0 skips PDB generation entirely for CI.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # ---- Gate 1: fmt (fastest, fail early) ----
  fmt:
    name: Format
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, win-17763]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure stable toolchain + rustfmt
        shell: cmd
        run: rustup toolchain install 1.96.0 --component rustfmt --no-self-update
      - name: cargo fmt --check
        shell: cmd
        run: cargo +1.96.0 fmt --all -- --check

  # ---- Gate 2: clippy on core crates (exclude client-ui Makepad GUI) ----
  clippy:
    name: Clippy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, win-17763]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Ensure stable toolchain + clippy
        shell: cmd
        run: rustup toolchain install 1.96.0 --component clippy --no-self-update
      - name: cargo clippy (workspace, excl. client-ui)
        shell: cmd
        run: cargo +1.96.0 clippy --locked --workspace --exclude nyx-client-ui --all-targets -- -D warnings

  # ---- Gate 3: workspace tests ----
  test:
    name: Test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, win-17763]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ensure stable toolchain
        shell: cmd
        run: rustup toolchain install 1.96.0 --no-self-update
      - name: cargo test --workspace (excl. client-ui)
        shell: cmd
        run: cargo +1.96.0 test --locked --workspace --exclude nyx-client-ui --all-targets

  # ---- Gate 4: standalone crates (each has its own [workspace]) ----
  standalone:
    name: Standalone crate tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, win-17763]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Ensure stable toolchain
        shell: cmd
        run: rustup toolchain install 1.96.0 --no-self-update
      - name: operator-kernelsdk lib tests
        shell: cmd
        run: cargo +1.96.0 test --locked --manifest-path crates/operator-kernelsdk/Cargo.toml --lib
      - name: implant-evasionsdk tests
        shell: cmd
        run: cargo +1.96.0 test --locked --manifest-path crates/implant-evasionsdk/Cargo.toml
      - name: minidump-assembler tests (P3.a)
        shell: cmd
        run: cargo +1.96.0 test --locked --manifest-path crates/minidump-assembler/Cargo.toml
      - name: offset-resolver build check (P0.b --fltmgr)
        shell: cmd
        run: cargo +1.96.0 check --locked --manifest-path crates/offset-resolver/Cargo.toml
      - name: operator-kernel-cli build check (P0.a/3.b)
        shell: cmd
        run: cargo +1.96.0 check --locked --manifest-path crates/operator-kernel-cli/Cargo.toml

  # The operator UI is outside the Rust workspace, so it needs an explicit
  # quality gate rather than relying on the workspace jobs above.
  ui-build:
    name: UI build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, win-17763]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install locked UI dependencies
        shell: cmd
        working-directory: crates/client-ui-web
        run: npm ci
      - name: Type-check and production build
        shell: cmd
        working-directory: crates/client-ui-web
        run: npm run build
