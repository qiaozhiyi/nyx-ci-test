name: Win BYOVD (hosted)

# kernelsdk BYOVD 验证 — 纯 GitHub-hosted runner(不依赖 self-hosted 17763)。
#
# 2026-08-16 驱动包清理: RTCore64 与 iqvw64e 均已实锤在微软 Vulnerable
# Driver Blocklist 上(hosted 镜像实测 RTCore64 NtLoadDriver 0xC0000034;
# iqvw64e 2023 年起在名单),已从 kernelsdk 驱动包删除,原 RTCore64 `byovd`
# job 一并移除 — 加载一个必被拦的驱动没有验证价值,其 blocklist 断言移交
# blocklist-gate(阳性对照)。BYOVD 默认驱动现为 Shield(clean,VA 任意
# memcpy);存活验证链:
#   - blocklist-gate: 离线断言 WDT/Shield/ALSysIO64 不在名单、RTCore64/
#     iqvw64e 在名单(阳性对照,scripts/check_byovd_blocklist.py)。
#   - byovd-wdt:      WDTKernel(WHQL, LoadsDespiteHVCI)真机加载 + loaded
#                     状态硬门 + assess JSON 断言。
#   - byovd-alsysio:  ALSysIO64(CPUID CPU-Z,钉 v2.0.8.0 SHA256)真机加载 +
#                     assess 硬门 — 第二条 clean phys 路径(2026-08-16 新增)。
#
# 覆盖: blocklist 离线回归 + WDT 真机加载/assess。P0.a/b 与 ETW-TI/DKOM/
# LSASS 的算法路径由 kernelsdk host 单测(ci.yml)覆盖;P4/P5 在
# windows-ci.yml 跑(纯用户态)。
#
# 授权红队安全研究。驱动二进制一律运行时从公开镜像拉取,不进 git 历史,
# 不随 workflow artifact 上传(只在 runner 临时目录,job 结束即销毁)。

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-byovd-hosted.yml'
      - 'crates/operator-kernelsdk/**'
      - 'crates/operator-kernel-cli/**'
      - 'crates/offset-resolver/**'
      - 'crates/minidump-assembler/**'
      - 'scripts/check_byovd_blocklist.py'

concurrency:
  group: win-byovd-hosted
  cancel-in-progress: true

jobs:
  # ---- 0. 离线 blocklist 回归门(2026-08-14)----
  # WDTKernel/Shield 的全部价值 = 不在 MS vulnerable-driver blocklist 上。哪天
  # 微软把它们加进去,这个 gate 必须红(否则 --wdt arm / 默认 Shield 会在目标
  # 机上无声失效)。脚本同时拿 RTCore64 + iqvw64e 做阳性对照(必须在名单上
  # —— 这正是它们被移出驱动包的原因)。纯 python3 stdlib,运行时下载数据集,
  # 不落地任何 repo 文件。
  blocklist-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: BYOVD blocklist regression gate (MS blocklist + LOLDrivers)
        run: python3 scripts/check_byovd_blocklist.py

      # ---- HVCI tripwire: MS blocklist version diff (2026-08-15, additive) ----
      # Report-only: pins the SiPolicy <VersionEx> and warns when Microsoft
      # ships a new blocklist revision — the early signal that WDTKernel may
      # have been added. The content gate above is the hard assertion; this
      # step exists so a revision bump surfaces even when the gate itself
      # fails early, and it writes a job-summary report. Never fails the job.
      - name: MS blocklist version diff (report-only tripwire)
        if: always()
        run: python3 scripts/check_byovd_blocklist.py --version-report

  # ---- WFP kit e2e(2026-08-16)----
  # UserModeEdrSilencer(netsec.rs)此前只有 host 端结构/布局单测——WFP FFI 在
  # macOS 上编不过,真实 BFE 行为从未被验证过。hosted windows runner 是
  # elevated + BFE 默认运行,wfp-selftest 全程 loopback(无网络依赖),
  # 是零成本硬门:baseline connect → ALE_APP_ID block(AppId 锚定自身临时
  # 副本,不碰真实 EDR)→ guard drop → 连接恢复(无残留)。任一阶段失败
  # job 红(exit 2 harness 坏 / 3 filter 没拦住 / 4 drop 后残留 / 5 操作错)。
  wfp-selftest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + build operator-kernel-cli
        uses: dtolnay/rust-toolchain@stable
      - name: Build nyx-kernel CLI
        run: cargo build --release --manifest-path crates/operator-kernel-cli/Cargo.toml
      - name: WFP kit self-test (hard gate)
        shell: pwsh
        run: |
          $out = & crates\operator-kernel-cli\target\release\nyx-kernel.exe wfp-selftest 2>&1
          $exit = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          $jsonLine = ($out | Where-Object { $_ -like '{"wfp_selftest":*' } | Select-Object -First 1)
          if (-not $jsonLine) { Write-Host "::error::no {\"wfp_selftest\":{...}} JSON line"; exit 1 }
          $r = ($jsonLine | ConvertFrom-Json).wfp_selftest
          Write-Host "baseline=$($r.baseline) blocked=$($r.blocked) restored=$($r.restored) filters=$($r.filters) note=$($r.note)"
          if ($exit -ne 0 -or -not ($r.baseline -and $r.blocked -and $r.restored -and $r.filters -eq 1)) {
            Write-Host "::error::WFP self-test failed (exit $exit)"
            exit 1
          }
          Write-Host "::notice::WFP kit e2e PASS — install/block/drop-restore all verified live"

  # ---- WDTKernel BYOVD arm(2026-08-14)----
  # WDTKernel(Dell Watchdog Timer, WHQL 签名, LOLDrivers #290)不在 MS
  # blocklist 上 — 这正是整条 --wdt 路径的价值(旧的 RTCore64 arm 已随该驱动
  # 从代码包删除而移除:它在全部 hosted 镜像被 WDAC 拦死,0xC0000034 实测)。
  # 驱动运行时从 LOLDrivers 公开仓库拉取(drivers/<md5>.bin,MZ + SHA256 双
  # 校验),不进 git、不上 artifact。HVCI/blocklist 开也照跑 —— WDT 的
  # LoadsDespiteHVCI=TRUE,probe 只作诊断,不做 skip 门。
  byovd-wdt:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # ---- 0. 诊断 probe(WDT 不因 HVCI/blocklist 跳过)----
      - name: Probe HVCI + blocklist status (diagnostics only)
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "OS: $($os.Caption) build $($os.BuildNumber)"
          $dg = Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard -ErrorAction SilentlyContinue
          if ($dg) {
            $dg | Select-Object SecurityServicesRunning, VirtualizationBasedSecurityStatus, CodeIntegrityPolicyEnforcementStatus | Format-List
          }
          $bl = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\CI\Config' -ErrorAction SilentlyContinue).VulnerableDriverBlocklistEnable
          Write-Host "VulnerableDriverBlocklistEnable = $bl (WDT loads despite HVCI/blocklist - this is the point of the arm)"

      - name: Disable Defender + add exclusions
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -Force -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -Force -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "nyx-kernel.exe","cargo.exe" -Force -ErrorAction SilentlyContinue

      # ---- 1. 拉 WDTKernel.sys(LOLDrivers 公开镜像,MZ + SHA256 校验)----
      - name: Fetch WDTKernel.sys (LOLDrivers mirror) + copy to System32\drivers
        shell: pwsh
        run: |
          # WDTKernel.sys = Dell Watchdog Timer (LOLDrivers issue #290).
          # LOLDrivers hosts driver binaries as drivers/<file-MD5>.bin via
          # Git LFS — raw.githubusercontent.com serves the LFS POINTER, so
          # the download must go through github.com/.../raw/... (which
          # redirects to the LFS media endpoint). Verified locally
          # 2026-08-14: 3a00cd7c…bin → 36968-byte PE32+ x86-64, SHA256
          # 8b695b1a… matches the LOLDrivers dataset entry. SHA256 pinned
          # per sample — stronger than a bare MZ check.
          # Relative-ImagePath rationale: copy into System32\drivers so
          # driver_load.rs emits "System32\drivers\..." (the absolute \??\
          # form is rejected on some builds).
          $staging = New-Item -ItemType Directory -Force -Path "target\drivers"
          $stagingPath = Join-Path $staging.FullName "WDTKernel.sys"
          $finalPath = "C:\Windows\System32\drivers\WDTKernel.sys"
          $candidates = @(
            @{ url = "https://github.com/magicsword-io/LOLDrivers/raw/main/drivers/3a00cd7cb37b2b4bfaa9e7715fdd13d5.bin";
               sha256 = "8B695B1A430336F49335162D8CA4137C2424640E27EE29511472FEA4451462FE" },
            @{ url = "https://github.com/magicsword-io/LOLDrivers/raw/main/drivers/1055e17ed942357c832a7dfd68861e7d.bin";
               sha256 = "0E27BEC347CA0050C455467BD8D774175C503B8AA1AF3411E94966F7DC6B28B7" },
            @{ url = "https://media.githubusercontent.com/media/magicsword-io/LOLDrivers/main/drivers/3a00cd7cb37b2b4bfaa9e7715fdd13d5.bin";
               sha256 = "8B695B1A430336F49335162D8CA4137C2424640E27EE29511472FEA4451462FE" },
            @{ url = "https://media.githubusercontent.com/media/magicsword-io/LOLDrivers/main/drivers/1055e17ed942357c832a7dfd68861e7d.bin";
               sha256 = "0E27BEC347CA0050C455467BD8D774175C503B8AA1AF3411E94966F7DC6B28B7" }
          )
          $got = $false
          foreach ($c in $candidates) {
            try {
              Write-Host "trying: $($c.url)"
              Invoke-WebRequest -Uri $c.url -OutFile $stagingPath -UseBasicParsing -TimeoutSec 60 -ErrorAction Stop
              $fs = [IO.File]::OpenRead($stagingPath)
              $b = New-Object byte[] 2
              $fs.Read($b, 0, 2) | Out-Null
              $fs.Close()
              if (-not ($b[0] -eq 0x4D -and $b[1] -eq 0x5A)) {
                Write-Host "  downloaded but NOT a valid PE (no MZ); trying next mirror"
                continue
              }
              $h = (Get-FileHash $stagingPath -Algorithm SHA256).Hash
              if ($h -ne $c.sha256) {
                Write-Host "  SHA256 mismatch (got $h, want $($c.sha256)); trying next mirror"
                continue
              }
              $sz = (Get-Item $stagingPath).Length
              Write-Host "::notice::downloaded: $stagingPath ($sz bytes, valid MZ + SHA256 match)"
              $got = $true
              break
            } catch {
              Write-Host "  failed: $($_.Exception.Message)"
            }
          }
          if (-not $got) {
            Write-Host "::error::all mirrors failed - LOLDrivers driver URL scheme may have changed"
            exit 1
          }
          Copy-Item -Path $stagingPath -Destination $finalPath -Force
          Write-Host "::notice::copied to $finalPath (build_image_path emits relative 'System32\drivers\WDTKernel.sys')"
          echo "DRIVER_PATH=$finalPath" >> $env:GITHUB_ENV

      # ---- 2. 构建 nyx-kernel CLI ----
      - name: Install Rust + build operator-kernel-cli
        uses: dtolnay/rust-toolchain@stable

      - name: Build nyx-kernel CLI
        shell: cmd
        run: |
          REM cmd 避免 PS 5.1 NativeCommandError 吞 cargo stderr
          cargo build --release --manifest-path crates/operator-kernel-cli/Cargo.toml
          if not exist "crates\operator-kernel-cli\target\release\nyx-kernel.exe" (
            echo ::error::nyx-kernel.exe build failed & exit /b 1
          )
          echo BUILD_OK

      # ---- 3. WDT phys-mode bootstrap(加载 + CR3 扫描 + MZ 验证)----
      - name: WDT bootstrap (load + CR3 discover)
        id: bootstrap
        shell: cmd
        continue-on-error: true   # load may fail; the loaded-state hard gate below decides
        run: |
          echo loaded=false>> "%GITHUB_OUTPUT%"
          echo === WDT phys-mode bootstrap ===
          echo DRIVER_PATH=%DRIVER_PATH%
          dir "%DRIVER_PATH%" 2>nul || echo DRIVER FILE MISSING
          crates\operator-kernel-cli\target\release\nyx-kernel.exe bootstrap --wdt "%DRIVER_PATH%" --wdt-svc NyaWDT
          echo BOOTSTRAP_EXIT=%ERRORLEVEL%
          reg query "HKLM\SYSTEM\CurrentControlSet\Services\NyaWDT" 2>nul || echo NO KEY (RegCreateKeyExW must have failed)
          if %ERRORLEVEL% NEQ 0 (
            echo ::warning::WDT bootstrap failed - see NTSTATUS above.
            exit /b 0
          )
          sc query NyaWDT | findstr /i "RUNNING" >nul && echo loaded=true>> "%GITHUB_OUTPUT%"

      - name: Driver not RUNNING — WDT assess not exercised (honest skip)
        if: steps.bootstrap.outputs.loaded != 'true'
        run: echo "::warning::WDTKernel load did not reach RUNNING state. --wdt assess hard gate skipped; offline coverage = cr3_scan unit tests + blocklist-gate job."

      # ---- 4. WDT assess — HARD GATE ----
      # bootstrap 已加载驱动(STATUS_IMAGE_ALREADY_LOADED 视为 OK);assess
      # 走完整 --wdt 链:open __WDT__ → CR3 scan(物理扫描 + MZ gate)→
      # VaKernelRw → T4-T5 评估。loaded==true 时必须 Assessed,否则 job 红。
      - name: Kernel assessment (nyx-kernel assess --wdt) - hard gate
        if: steps.bootstrap.outputs.loaded == 'true'
        shell: pwsh
        run: |
          $exe = "crates\operator-kernel-cli\target\release\nyx-kernel.exe"
          Write-Host "=== T-REX kernel assessment (WDT phys-mode) ==="
          $out = & $exe assess --wdt "$env:DRIVER_PATH" --wdt-svc NyaWDT 2>&1
          $exit = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) {
            Write-Host "::error::nyx-kernel assess --wdt exited $exit - assessment must run on the hosted runner"
            exit 1
          }
          $jsonLine = ($out | Where-Object { $_ -like '{"assess":*' } | Select-Object -First 1)
          if (-not $jsonLine) {
            Write-Host "::error::no {""assess"":{...}} JSON line in nyx-kernel assess output"
            exit 1
          }
          $assess = $jsonLine | ConvertFrom-Json
          $a = $assess.assess
          Write-Host "status=$($a.status) total_drivers=$($a.total_drivers) edr_drivers=$($a.edr_drivers) hvci=$($a.hvci_enabled) vbs=$($a.vbs_enabled)"
          if ($a.status -ne "Assessed") {
            Write-Host "::error::kernel assessment NotAssessed via --wdt"
            exit 1
          }
          if ($a.total_drivers -le 0) {
            Write-Host "::error::kernel module enumeration returned 0 modules"
            exit 1
          }
          Write-Host "::notice::WDT kernel assessment PASS: status=Assessed, $($a.total_drivers) modules"

  # ---- ALSysIO64 BYOVD arm(2026-08-16)----
  # ALSysIO64.sys(CPUID CPU-Z,LOLDrivers 4d365dd0)不在 MS blocklist 上。
  # ⚠ 钉死 v2.0.8.0(SHA256 7196187f…):v2.1.0.0 的 dispatch 删掉了 R/W
  # IOCTL(0x9C402618/61C 落到 STATUS_NOT_IMPLEMENTED 默认臂,jump-table
  # 解码实证,见 byovd_drivers/alsysio.rs 头注释)。加载 v2.1.0.0 会得到
  # 能开设备但读写全败的死驱动——所以本 job 的 loaded 硬门之外还有
  # assess 全链硬门(CR3 扫描 + MZ 验证不过就红)。
  byovd-alsysio:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Disable Defender + add exclusions
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -Force -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -Force -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "nyx-kernel.exe","cargo.exe" -Force -ErrorAction SilentlyContinue

      # ---- 1. 拉 ALSysIO64 v2.0.8.0(LOLDrivers LFS,MZ + SHA256 钉)----
      - name: Fetch ALSysIO64.sys v2.0.8.0 (pinned SHA256) + copy to System32\drivers
        shell: pwsh
        run: |
          $staging = New-Item -ItemType Directory -Force -Path "target\drivers"
          $stagingPath = Join-Path $staging.FullName "ALSysIO64.sys"
          $finalPath = "C:\Windows\System32\drivers\ALSysIO64.sys"
          $candidates = @(
            @{ url = "https://github.com/magicsword-io/LOLDrivers/raw/main/drivers/13dda15ef67eb265869fc371c72d6ef0.bin";
               sha256 = "7196187FB1EF8D108B380D37B2AF8EFDEB3CA1F6EEFD37B5DC114C609147216D" },
            @{ url = "https://media.githubusercontent.com/media/magicsword-io/LOLDrivers/main/drivers/13dda15ef67eb265869fc371c72d6ef0.bin";
               sha256 = "7196187FB1EF8D108B380D37B2AF8EFDEB3CA1F6EEFD37B5DC114C609147216D" }
          )
          $got = $false
          foreach ($c in $candidates) {
            try {
              Write-Host "trying: $($c.url)"
              Invoke-WebRequest -Uri $c.url -OutFile $stagingPath -UseBasicParsing -TimeoutSec 60 -ErrorAction Stop
              $fs = [IO.File]::OpenRead($stagingPath)
              $b = New-Object byte[] 2
              $fs.Read($b, 0, 2) | Out-Null
              $fs.Close()
              if (-not ($b[0] -eq 0x4D -and $b[1] -eq 0x5A)) {
                Write-Host "  downloaded but NOT a valid PE (no MZ); trying next mirror"
                continue
              }
              $h = (Get-FileHash $stagingPath -Algorithm SHA256).Hash
              if ($h -ne $c.sha256) {
                Write-Host "  SHA256 mismatch (got $h, want $($c.sha256)); trying next mirror"
                continue
              }
              $sz = (Get-Item $stagingPath).Length
              Write-Host "::notice::downloaded: $stagingPath ($sz bytes, valid MZ + SHA256 match)"
              $got = $true
              break
            } catch {
              Write-Host "  failed: $($_.Exception.Message)"
            }
          }
          if (-not $got) {
            Write-Host "::error::all mirrors failed - LOLDrivers driver URL scheme may have changed"
            exit 1
          }
          Copy-Item -Path $stagingPath -Destination $finalPath -Force
          echo "DRIVER_PATH=$finalPath" >> $env:GITHUB_ENV

      - name: Install Rust + build operator-kernel-cli
        uses: dtolnay/rust-toolchain@stable
      - name: Build nyx-kernel CLI
        shell: cmd
        run: |
          cargo build --release --manifest-path crates/operator-kernel-cli/Cargo.toml
          if not exist "crates\operator-kernel-cli\target\release\nyx-kernel.exe" (
            echo ::error::nyx-kernel.exe build failed & exit /b 1
          )
          echo BUILD_OK

      # ---- 2. ALSysIO phys-mode bootstrap(加载 + CR3 扫描 + MZ 验证)----
      - name: ALSysIO bootstrap (load + CR3 discover)
        id: bootstrap
        shell: cmd
        continue-on-error: true
        run: |
          echo loaded=false>> "%GITHUB_OUTPUT%"
          echo === ALSysIO phys-mode bootstrap ===
          crates\operator-kernel-cli\target\release\nyx-kernel.exe bootstrap --alsysio "%DRIVER_PATH%" --alsysio-svc NyaAlsys
          echo BOOTSTRAP_EXIT=%ERRORLEVEL%
          if %ERRORLEVEL% NEQ 0 (
            echo ::warning::ALSysIO bootstrap failed - see error above.
            exit /b 0
          )
          sc query NyaAlsys | findstr /i "RUNNING" >nul && echo loaded=true>> "%GITHUB_OUTPUT%"

      - name: Driver not RUNNING — assess not exercised (honest skip)
        if: steps.bootstrap.outputs.loaded != 'true'
        run: echo "::warning::ALSysIO64 load did not reach RUNNING state. assess hard gate skipped; offline coverage = alsysio unit tests + blocklist-gate job."

      # ---- 3. assess — HARD GATE(loaded==true 时必须 Assessed)----
      - name: Kernel assessment (nyx-kernel assess --alsysio) - hard gate
        if: steps.bootstrap.outputs.loaded == 'true'
        shell: pwsh
        run: |
          $exe = "crates\operator-kernel-cli\target\release\nyx-kernel.exe"
          Write-Host "=== T-REX kernel assessment (ALSysIO phys-mode) ==="
          $out = & $exe assess --alsysio "$env:DRIVER_PATH" --alsysio-svc NyaAlsys 2>&1
          $exit = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) {
            Write-Host "::error::nyx-kernel assess --alsysio exited $exit"
            exit 1
          }
          $jsonLine = ($out | Where-Object { $_ -like '{"assess":*' } | Select-Object -First 1)
          if (-not $jsonLine) { Write-Host "::error::no assess JSON line"; exit 1 }
          $a = ($jsonLine | ConvertFrom-Json).assess
          Write-Host "status=$($a.status) total_drivers=$($a.total_drivers)"
          if ($a.status -ne "Assessed" -or $a.total_drivers -le 0) {
            Write-Host "::error::ALSysIO assessment failed"
            exit 1
          }
          Write-Host "::notice::ALSysIO kernel assessment PASS: status=Assessed, $($a.total_drivers) modules"
