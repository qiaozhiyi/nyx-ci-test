name: Win KslD (hosted windows-latest)

# Kernel-tier LivingOffDefender smoke: builds the CLI + resolver and attempts
# the KslD bootstrap. On GitHub-hosted runners the MpKsl device is not exposed
# and HVCI blocks driver loading, so the bootstrap step self-skips
# (continue-on-error) — the job still gates the builds and the live-PDB
# offset resolution against the host's own kernel.
#
# Authorized red-team security research.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-kself-hosted.yml'
      - 'crates/operator-kernelsdk/**'
      - 'crates/operator-kernel-cli/**'
      - 'crates/offset-resolver/**'

concurrency:
  group: win-kself-hosted
  cancel-in-progress: true

jobs:
  ksld:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: "Environment check (build / Defender / KslD)"
        shell: powershell
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "OS: $($os.Caption) build $($os.BuildNumber)"
          $ksld = Get-CimInstance Win32_SystemDriver | Where-Object { $_.Name -eq 'KslD' }
          Write-Host "KslD driver: $($ksld.State) ($($ksld.PathName))"
          $def = Get-MpComputerStatus
          Write-Host "Defender: AMRunningMode=$($def.AMRunningMode) RTP=$($def.RealTimeProtectionEnabled)"

      - name: Build operator CLI + offset-resolver
        shell: cmd
        run: |
          REM Use cmd (not powershell) so cargo's stderr progress ("Compiling...")
          REM isn't reinterpreted as a NativeCommandError by PS 5.1 and aborting.
          cargo build --release --manifest-path crates/operator-kernel-cli/Cargo.toml
          if not exist "crates\operator-kernel-cli\target\release\nyx-kernel.exe" (
            echo ::error::operator-kernel-cli build failed & exit /b 1
          )
          cargo build --manifest-path crates/offset-resolver/Cargo.toml
          echo BUILD_OK

      - name: "Live PDB offset resolution (host build)"
        shell: powershell
        run: |
          # One-shot: offset-resolver reads the live ntoskrnl.exe's PE debug
          # dir (goblin), downloads the matching PDB from MS symbol server,
          # parses EPROCESS + ETW-TI 4-hop chain offsets. The build number is
          # taken from the registry (never hardcoded).
          $hostBuild = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuildNumber
          & crates\offset-resolver\target\debug\nyx-offset-resolver.exe --ntoskrnl C:\Windows\System32\ntoskrnl.exe --build $hostBuild --out offsets_live.toml
          type offsets_live.toml

      - name: "Kernel bootstrap via KslD (Living off the Defender)"
        shell: cmd
        continue-on-error: true   # KslD IOCTL may differ by Defender engine version
        run: |
          REM bootstrap_chain defaults to KslD first (no --byovd = no driver load).
          REM It opens the MpKsl device, gets a KernelRw, resolves offsets.
          crates\operator-kernel-cli\target\release\nyx-kernel.exe bootstrap
          echo BOOTSTRAP_EXIT=%ERRORLEVEL%

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksld-${{ github.run_id }}
          path: |
            offsets_17763_live.toml
          if-no-files-found: ignore
          retention-days: 14
