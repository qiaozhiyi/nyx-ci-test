name: Win KslD (self-hosted 17763)

# Runs the kernel-tier bypass stack on the self-hosted physical Win Server 2019
# (build 17763, HVCI off, Defender + KslD running). The runner is registered
# directly on the host (label: win-17763) — no SSH, no scp, no escaping layer.
# GitHub dispatches the job to the runner agent; it executes locally.
#
# Why this isn't on a GitHub-hosted runner: KslD needs the MpKsl device (a
# Defender kernel driver), GitHub's Windows runners don't expose it, and even
# if they did they lack the admin token KslD requires.
#
# Why this isn't the old SSH-tunnel workflow: that hit 7 distinct edge cases in
# the ubuntu→SSH→PowerShell→git stack. A self-hosted runner is the documented,
# supported path for "run CI on my own machine."
#
# Authorized red-team security research.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-kself-hosted.yml'
      - 'crates/operator-kernelsdk/**'
      - 'crates/operator-kernel-cli/**'
      - 'crates/offset-resolver/**'

concurrency:
  group: win-kself-hosted
  cancel-in-progress: true

jobs:
  ksld:
    runs-on: [self-hosted, win-17763]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: "Environment check (build / Defender / KslD)"
        shell: powershell
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "OS: $($os.Caption) build $($os.BuildNumber)"
          $ksld = Get-CimInstance Win32_SystemDriver | Where-Object { $_.Name -eq 'KslD' }
          Write-Host "KslD driver: $($ksld.State) ($($ksld.PathName))"
          $def = Get-MpComputerStatus
          Write-Host "Defender: AMRunningMode=$($def.AMRunningMode) RTP=$($def.RealTimeProtectionEnabled)"

      - name: Build operator CLI + offset-resolver
        shell: powershell
        run: |
          # MSVC is the host's default toolchain. Full output — no piping, so
          # compile errors are visible (the '| Select-Object -Last N' trap from
          # the old workflow hid real errors).
          cargo build --release --manifest-path crates/operator-kernel-cli/Cargo.toml 2>&1
          if (-not (Test-Path "crates/operator-kernel-cli/target/release/nyx-kernel.exe")) {
            Write-Host "::error::operator-kernel-cli build failed"; exit 1
          }
          cargo build --manifest-path crates/offset-resolver/Cargo.toml 2>&1
          Write-Host "BUILD_OK"

      - name: "Live PDB offset resolution (17763 ground truth)"
        shell: powershell
        run: |
          # Extract the PDB GUID from this host's ntoskrnl.exe, download the
          # matching PDB from MS symbol server, parse with offset-resolver.
          # Verifies the multi-version adapter resolves the correct offsets for
          # THIS exact build+LCU (17763.1339 → ProviderEnableInfo @ 0x060).
          $resolver = "crates/offset-resolver/target/debug/nyx-offset-resolver.exe"
          $script:bytes = [IO.File]::ReadAllBytes("C:\Windows\System32\ntoskrnl.exe")
          $script:pe = [BitConverter]::ToInt32($script:bytes, 0x3C)
          $script:numSec = [BitConverter]::ToUInt16($script:bytes, $script:pe + 6)
          $script:optSz = [BitConverter]::ToUInt16($script:bytes, $script:pe + 20)
          $script:secStart = $script:pe + 24 + $script:optSz
          function Resolve-FileOffset($rva) {
            for ($i=0; $i -lt $script:numSec; $i++) {
              $s = $script:secStart + $i*40
              $va = [BitConverter]::ToInt32($script:bytes, $s+12)
              $vs = [BitConverter]::ToInt32($script:bytes, $s+8)
              $pr = [BitConverter]::ToInt32($script:bytes, $s+20)
              if ($rva -ge $va -and $rva -lt ($va+$vs)) { return $pr + ($rva - $va) }
            }
            return $rva
          }
          $ddVA = [BitConverter]::ToInt32($script:bytes, $script:pe + 24 + 0xA0)
          $ddSize = [BitConverter]::ToInt32($script:bytes, $script:pe + 24 + 0xA4)
          $ddOff = Resolve-FileOffset $ddVA
          $guid = $null; $age = 0
          for ($i=0; $i -lt ($ddSize/28); $i++) {
            $e = $ddOff + $i*28
            # IMAGE_DEBUG_TYPE_CODEVIEW = 2 (verified — NOT 6)
            if ([BitConverter]::ToInt32($script:bytes, $e+12) -eq 2) {
              $cv = [BitConverter]::ToInt32($script:bytes, $e+24)
              if ($cv -le 0) { $cv = Resolve-FileOffset ([BitConverter]::ToInt32($script:bytes, $e+20)) }
              if ($script:bytes[$cv] -eq 0x52 -and $script:bytes[$cv+1] -eq 0x53 -and $script:bytes[$cv+2] -eq 0x44 -and $script:bytes[$cv+3] -eq 0x53) {
                $d1 = [BitConverter]::ToUInt32($script:bytes, $cv+4)
                $d2 = [BitConverter]::ToUInt16($script:bytes, $cv+8)
                $d3 = [BitConverter]::ToUInt16($script:bytes, $cv+10)
                $guid = ("{0:X8}{1:X4}{2:X4}" -f $d1,$d2,$d3)
                for ($j=12; $j -lt 20; $j++) { $guid += ("{0:X2}" -f $script:bytes[$cv+$j]) }
                $age = [BitConverter]::ToInt32($script:bytes, $cv+20)
                break
              }
            }
          }
          if (-not $guid) { Write-Host "::error::could not extract PDB GUID"; exit 1 }
          Write-Host "Live ntoskrnl PDB: GUID=$guid AGE=$age"
          & $resolver --guid $guid --age $age --out offsets_17763_live.toml 2>&1
          Get-Content offsets_17763_live.toml

      - name: "Kernel bootstrap via KslD (Living off the Defender)"
        shell: powershell
        continue-on-error: true   # KslD IOCTL may differ by Defender engine version
        run: |
          # bootstrap_chain defaults to KslD first (no --byovd → no driver load).
          # It opens the MpKsl device, gets a KernelRw, resolves offsets, and
          # (if we wire a subcommand) can blind ETW-TI. Here we just confirm
          # the bootstrap succeeds — the KslD path works on this host.
          $exe = "crates/operator-kernel-cli/target/release/nyx-kernel.exe"
          & $exe bootstrap 2>&1
          Write-Host "BOOTSTRAP_EXIT=$LASTEXITCODE"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ksld-${{ github.run_id }}
          path: |
            offsets_17763_live.toml
          if-no-files-found: ignore
          retention-days: 14
