name: Windows CI

# The main Windows gate. Runs on GitHub-hosted windows-latest (Server 2025).
# Covers:
#   1. Build (nightly MSVC implant DLL + operator CLI + offset-resolver)
#   2. User-mode selftests (evasion stack) — the rundll32 suite is SKIPPED on
#      hosted runners: GitHub runners execute jobs in non-interactive Session 0
#      where rundll32 never reaches the selftest exports (verified 2026-08-01
#      via entry markers; the same exports pass on real machines — P4-P5
#      workflow). Kept as a HARD gate for self-hosted interactive runners.
#      Console-probe hard gates DO run on hosted runners via bof-isolated-probe
#      (LoadLibrary + direct export call, no rundll32): nyx_selftest_bof_isolated,
#      WP-A nyx_selftest_inject_fls (inject method 3), and the 08-28 Session-0-
#      safe exports (vad / inject_threadless / fluctuation / inject_pool /
#      cfgstage) below.
#   3. Live PDB offset resolution — extracts the GUID from the runner's own
#      ntoskrnl.exe, downloads the matching PDB from the MS symbol server,
#      and verifies the offset-resolver extracts correct EPROCESS + ETW-TI
#      offsets on a real kernel (build taken from the host, no hardcode).
#
# The BYOVD kernel-tier chain (driver load → ETW-TI blind → process hide)
# runs in windows-byovd-hosted.yml or windows-kself-hosted.yml.
#
# Authorized red-team security research.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# This workflow runs on GitHub-hosted Windows. Keep its token read-only and
# do not run code supplied by an external fork on it.
permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Implant build + selftest (build 17763) ----
  implant:
    name: "Implant (windows-latest)"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: "OS check"
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Build: $($os.BuildNumber) | $($os.Caption)"
      - uses: actions/checkout@v4

      - name: Ensure nightly toolchain + rust-src
        shell: cmd
        run: rustup toolchain install nightly --component rust-src --no-self-update & rustup target add x86_64-pc-windows-msvc --toolchain nightly

      # ---- 1. Build the three binaries ----
      - name: Build implant DLL (nightly)
        shell: pwsh
        run: |
          # --features selftest: the ~50 nyx_selftest_* rundll32 exports are
          # #[cfg(feature = "selftest")]; without this flag the DLL CI invokes
          # below does not contain them and every test reports "missing entry".
          # Full output — never pipe to Select-Object, so compile errors show.
          #
          # pwsh NativeCommandError trap: cargo writes compile progress to
          # stderr (standard Rust behavior), and pwsh treats ANY non-empty
          # stderr from a native command as a terminating error → RemoteException
          # → exit 1, even when the build succeeded. The release scripts
          # (scripts/release/build_*.ps1) already solve this with the
          # EAP=Continue try/finally pattern documented in CHANGELOG v0.3.0.
          # Mirror it here so a green build isn't masked as a failure.
          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            cargo +nightly build --release --features selftest --manifest-path crates/implant-win/Cargo.toml --target x86_64-pc-windows-msvc 2>&1 |
              Out-String | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "cargo build exited $LASTEXITCODE" }
          } finally {
            $ErrorActionPreference = $prevEap
          }
          $dll = "crates/implant-win/target/x86_64-pc-windows-msvc/release/nyx_implant_win.dll"
          if (-not (Test-Path $dll)) { Write-Host "::error::implant DLL build failed"; exit 1 }
          Write-Host "DLL OK: $((Get-Item $dll).Length) bytes"

      - name: Build operator CLI + offset-resolver (stable)
        shell: pwsh
        run: |
          # Same pwsh NativeCommandError workaround as the implant build above.
          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            cargo build --release --manifest-path crates/operator-kernel-cli/Cargo.toml 2>&1 |
              Out-String | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "CLI build exited $LASTEXITCODE" }
            cargo build --manifest-path crates/offset-resolver/Cargo.toml 2>&1 |
              Out-String | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "resolver build exited $LASTEXITCODE" }
          } finally {
            $ErrorActionPreference = $prevEap
          }
          Write-Host "CLI + resolver built"

      # ---- 1b. REAL-MACHINE Layer-2 probe (EXE harness, no rundll32) ----
      # Runs the complete NYX2 blob in-process: wrap_payload -> VirtualAlloc ->
      # Layer-1 self-locate -> bridge -> pic-loader Layer-2 (PEB walk, chacha
      # decrypt, reflective PE load) -> DllMain of the real implant DLL.
      # Deliberately avoids rundll32/LoadLibrary-on-the-blob (the paths that
      # hang in Session 0 / Server-2025 loader quirks), so this works on
      # GitHub-hosted runners — real Windows E2E with zero local hardware.
      #
      # PASSING since 2026-08-02 (SizeOfImage/optional-header fixes + thread
      # entry model). HARD gate: fixture + real implant DLL must both return 0.
      - name: Real-machine Layer-2 probe
        shell: pwsh
        run: |
          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            # MSVC enables CET (CETCOMPAT) by default; the thread-entry model
            # avoids indirect-call enforcement, but keep the flag off anyway.
            $env:RUSTFLAGS = "-C link-arg=/CETCOMPAT:NO"
            cargo build --release -p nyx-loader-probe-exe 2>&1 | Out-String | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "probe build exited $LASTEXITCODE" }
          } finally {
            $ErrorActionPreference = $prevEap
          }
          $probe = "target\release\nyx-loader-probe-exe.exe"
          $dll = "crates\implant-win\target\x86_64-pc-windows-msvc\release\nyx_implant_win.dll"
          $fixture = "crates\loader-probe-exe\fixture\dllmain_ok.dll"
          if (-not (Test-Path $probe)) { Write-Host "::error::probe exe missing"; exit 1 }
          if (-not (Test-Path $dll)) { Write-Host "::error::implant DLL missing"; exit 1 }
          if (-not (Test-Path $fixture)) { Write-Host "::error::fixture DLL missing"; exit 1 }
          # Stale-marker guard: the fixture's DllMain writes this file on
          # DLL_PROCESS_ATTACH; a leftover from a previous run would false-pass
          # round 1 even if DllMain never executed. Delete it before invoking.
          $marker = "C:\nyx_probe_fixture_loaded.txt"
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          Write-Host "--- probe round 1: fixture dllmain_ok.dll ---"
          & $probe $fixture
          $fixture_exit = $LASTEXITCODE
          Write-Host "--- probe round 2: real implant DLL ---"
          & $probe $dll
          $dll_exit = $LASTEXITCODE
          # The fixture's DllMain writes this marker on DLL_PROCESS_ATTACH;
          # its presence proves DllMain executed inside the reflective load
          # (any stale copy was deleted before round 1).
          $marker_ok = Test-Path $marker
          if ($fixture_exit -ne 0 -or $dll_exit -ne 0 -or -not $marker_ok) {
            Write-Host "::error::real-machine Layer-2 probe FAILED (fixture=$fixture_exit dll=$dll_exit marker=$marker_ok)"
            exit 1
          }
          Write-Host "::notice::real-machine Layer-2 probe PASSED (fixture=$fixture_exit dll=$dll_exit DllMain-marker=$marker_ok)"

      # ---- 1c. DRIVERLESS kernel assessment (nyx-kernel assess --user) ----
      # Real T-REX T4-T5 data on ANY real Windows without a driver: the two
      # user-mode NtQuery paths (SystemModuleInformation class 11 /
      # SystemCodeIntegrityInformation class 103) plus the KUSER_SHARED_DATA
      # kernel-debugger probe. HARD gate: status must be Assessed with a
      # non-empty module list on this hosted runner (a real kernel, real
      # data — nothing to skip). The BYOVD/KslD variant (callback arrays +
      # ETW-TI) runs in windows-byovd-hosted.yml when HVCI is off.
      - name: Kernel assessment (nyx-kernel assess --user) - hard gate
        shell: pwsh
        run: |
          # operator-kernel-cli is a standalone workspace: its binary lands in
          # its own target dir, not the root one (fixed 2026-08).
          $exe = "crates\operator-kernel-cli\target\release\nyx-kernel.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error::nyx-kernel.exe missing"; exit 1 }
          $out = & $exe assess --user 2>&1
          $exit = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) {
            Write-Host "::error::nyx-kernel assess --user exited $exit"
            exit 1
          }
          $jsonLine = ($out | Where-Object { $_ -like '{"assess":*' } | Select-Object -First 1)
          if (-not $jsonLine) {
            Write-Host "::error::no {""assess"":{...}} JSON line in output"
            exit 1
          }
          $a = ($jsonLine | ConvertFrom-Json).assess
          Write-Host "status=$($a.status) total_drivers=$($a.total_drivers) edr_drivers=$($a.edr_drivers) hvci=$($a.hvci_enabled) vbs=$($a.vbs_enabled)"
          if ($a.status -ne "Assessed") {
            Write-Host "::error::kernel assessment NotAssessed - the NtQuery paths failed on this runner"
            exit 1
          }
          if ($a.total_drivers -le 0) {
            Write-Host "::error::module enumeration returned 0 modules - NtQuerySystemInformation(11) failed"
            exit 1
          }
          Write-Host "::notice::kernel assessment PASS: status=Assessed, $($a.total_drivers) modules, $($a.edr_drivers) EDR drivers"

      # ---- 2. User-mode selftests on this kernel ----
      # GATES THE PR. continue-on-error was removed: a selftest that crashes,
      # times out, or hits the 0xFFFFFFFF/0xFFFFFFFE harness-failure sentinels
      # now fails the workflow. Passing selftests exit nonzero (bitmask of the
      # sub-checks that passed, per selftests.rs:1-16); the two 0xFFFFFFFF*
      # codes are the documented bootstrap-failure sentinels (selftests.rs:5,42).
      #
      # GitHub-hosted runners hang here (non-interactive Session 0 — rundll32
      # never reaches the exports; CHANGELOG v0.3.2 known limitation, verified
      # with entry markers 2026-08-01). Skip with a notice on hosted runners;
      # the gate stays HARD on self-hosted interactive machines. Hosted
      # coverage of Session-0-safe exports is the B3/B4 console-probe steps
      # plus the 08-28 vad/threadless/fluctuation/pool/cfgstage step below.
      # Additional real-machine coverage runs via the P4-P5 workflow.
      - name: Selftest regression (evasion stack)
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -eq 'github-hosted') {
            Write-Host "::notice::rundll32 selftests skipped: GitHub-hosted runner is non-interactive Session 0; rundll32 never reaches the exports (known limitation v0.3.2). Hosted coverage is B3/B4 + 08-28 console-probe steps; additional real-machine coverage via P4-P5."
            exit 0
          }
          # Build 17763 (Windows Server 2019). The implant's anti-sandbox
          # suite (envprobe + antidebug) may flag the host as a VM, so we set
          # NYX_SKIP_SANDBOX=1 to bypass that gate and let the selftests
          # actually execute. The admin token means privileged APIs work.
          $env:NYX_SKIP_SANDBOX = "1"
          $dll = "crates/implant-win/target/x86_64-pc-windows-msvc/release/nyx_implant_win.dll"
          $dllDir = Split-Path $dll
          # NOTE: nyx_selftest_foliage / nyx_selftest_foliage_apc were removed
          # (selftests.rs:2473-2474 — Foliage APC chain is dead code). Do not
          # re-add them here: rundll32 would emit "missing entry" and exit 0,
          # which the sentinel check below would treat as success.
          $tests = @(
            "nyx_selftest","nyx_selftest_postex","nyx_selftest_evasion",
            "nyx_selftest_syscall_rt","nyx_selftest_blind_nttrace",
            "nyx_selftest_hookchain",
            "nyx_selftest_inject_pool","nyx_selftest_lacuna",
            "nyx_selftest_bof_isolated"
          )
          Write-Host "Test                      Exit   Bits"
          Write-Host "------------------------- ------ ----"
          $failed = @()
          foreach ($t in $tests) {
            $p = Start-Process rundll32.exe -ArgumentList "$dll,$t" -PassThru -WindowStyle Hidden -WorkingDirectory $dllDir
            $p.WaitForExit(25000) | Out-Null
            if ($p.HasExited) {
              $code = $p.ExitCode
              $bits = if ($code -ge 0) { [Convert]::ToString($code, 2) } else { "0x{0:X}" -f $code }
              Write-Host ("{0,-25} {1,6} {2}" -f $t, $code, $bits)
              # 0xFFFFFFFF = harness bootstrap fail, 0xFFFFFFFE = RT bootstrap
              # fail (selftests.rs:5,42). Any other value (incl. 0) is a real
              # bitmask the test produced and therefore "ran". A TIMEOUT is
              # the only non-bootstrap run failure we treat as hard-fail here.
              if ($code -eq -1 -or $code -eq 0xFFFFFFFE -or $code -eq -2) {
                $failed += "{0}=0x{1:X8} (bootstrap sentinel)" -f $t, $code
              }
            } else {
              $p.Kill(); Write-Host ("{0,-25} TIMEOUT" -f $t)
              $failed += "$t=TIMEOUT"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::selftest failures:`n  - " + ($failed -join "`n  - ")
            exit 1
          }
          Write-Host "::notice::all $($tests.Count) selftests ran without bootstrap-sentinel or timeout failures"

      # ---- B3 isolated-BOF probe (real machine, hosted-runnable) ----
      # Unlike the rundll32 selftests above, this one also runs on
      # GitHub-hosted runners: the probe is a plain console process that
      # loads the selftest DLL and calls the export directly (loader-probe
      # precedent), and the sacrificial child (notepad.exe, suspended +
      # hijacked) never touches the interactive desktop — its main thread is
      # the bof-host PIC blob. The probe's exit code is the selftest bitmask:
      # 7 = 0b0111 (fixtures ok, bof_print.o round-tripped through the pipe,
      # crash fixture surfaced as an error, beacon survived).
      - name: B3 isolated-BOF probe (real machine)
        shell: pwsh
        run: |
          cargo build --release -p nyx-bof-isolated-probe 2>&1 | Out-String | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "probe build exited $LASTEXITCODE" }
          $dll = "crates/implant-win/target/x86_64-pc-windows-msvc/release/nyx_implant_win.dll"
          & "target/release/nyx-bof-isolated-probe.exe" $dll
          if ($LASTEXITCODE -ne 7) {
            throw "nyx_selftest_bof_isolated expected exit 7 (0b0111), got $LASTEXITCODE"
          }
          Write-Host "B3 isolated-BOF probe: PASS (0b0111)"
          # pwsh steps fail on a non-zero $LASTEXITCODE even without throw —
          # the probe's expected exit is 7, so reset explicitly (same trap as
          # the syscall_rt step in b3-verify.yml; caught on the public CI
          # mirror, nyx-ci-test run 31312910796).
          exit 0

      # ---- CRT3 sleeper (Pool Party sacrificial; FLS prefers it under Prism) ----
      # nyx_selftest_inject_pool / inject_fls look for C:\nyx_test\nyx_x64_sleeper.exe
      # (CRT3_SLEEPER in selftests.rs). Hosted images do not ship that path, so
      # pool party used to fall back to notepad.exe — which never calls
      # CreateThreadpoolWork, so the handle-table scan finds no worker factory
      # (exit 9 env-skip / matrix 0.0%). Compile the in-tree sleeper with MSVC
      # before B4 and the 08-28 console selftests so the target actually has a
      # factory. SubmitThreadpoolWork on the default pool is enough.
      - name: Deploy CRT3 sleeper (Pool Party target)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\nyx_test | Out-Null
          $src = "tools\crt_probe3_sleeper.c"
          $out = "C:\nyx_test\nyx_x64_sleeper.exe"
          if (-not (Test-Path $src)) { Write-Host "::error::$src missing"; exit 1 }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Host "::error::vswhere.exe missing"; exit 1 }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { Write-Host "::error::VS with VC tools not found"; exit 1 }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { Write-Host "::error::vcvars64.bat missing at $vcvars"; exit 1 }
          # pwsh NativeCommandError trap: cl.exe / vcvars write to stderr.
          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            cmd /c "call `"$vcvars`" && cl /nologo /O2 /Fe:$out $src /link /SUBSYSTEM:WINDOWS" 2>&1 |
              Out-String | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "cl.exe exited $LASTEXITCODE" }
          } finally {
            $ErrorActionPreference = $prevEap
          }
          if (-not (Test-Path $out)) { Write-Host "::error::sleeper exe missing after compile: $out"; exit 1 }
          $sz = (Get-Item $out).Length
          if ($sz -le 0) { Write-Host "::error::sleeper exe is 0 bytes: $out"; exit 1 }
          Write-Host "CRT3 sleeper OK: $sz bytes at $out"

      # ---- B4 FLS callback-inject selftest (WP-A, inject method 3) ----
      # nyx_selftest_inject_fls (implant-tasks/src/selftests.rs:667): forces
      # FLS_INJECT_ENABLED on, spawns a RUNNING notepad sacrificial (Session-0
      # safe — no window-station interaction needed for kernel32 to map), then
      # do_inject(3, pid) registers a remote FLS callback + trigger stub with a
      # 1-byte `ret` probe payload. Same hosted-runnable harness as the B3
      # probe above (no rundll32). HARD gate: exit must be exactly 7 (0b0111 =
      # sacrificial spawned | kernel32 mapped | "fls callback inject ok").
      # Defender realtime is deliberately left ON: a block/detection is itself
      # signal — on failure the "Defender telemetry" step at the end of this
      # job captures Get-MpThreatDetection as an artifact.
      - name: FLS callback-inject selftest (inject method 3)
        shell: pwsh
        run: |
          # Anti-sandbox suite may flag the hosted runner as a VM; bypass so
          # the selftest actually executes (same as the regression step above).
          $env:NYX_SKIP_SANDBOX = "1"
          $probe = "target\release\nyx-bof-isolated-probe.exe"
          $dll = "crates\implant-win\target\x86_64-pc-windows-msvc\release\nyx_implant_win.dll"
          if (-not (Test-Path $probe)) { Write-Host "::error::probe exe missing"; exit 1 }
          if (-not (Test-Path $dll)) { Write-Host "::error::implant DLL missing"; exit 1 }
          Write-Host "Defender DisableRealtimeMonitoring: $((Get-MpPreference).DisableRealtimeMonitoring)"
          # Start-Process + explicit timeout (not `&`): do_inject(3) waits for
          # remote kernel32; a hung wait must not burn the 25-min job timeout.
          $p = Start-Process $probe -ArgumentList "`"$dll`"","nyx_selftest_inject_fls" -PassThru -WindowStyle Hidden
          $p.WaitForExit(45000) | Out-Null
          if (-not $p.HasExited) {
            $p.Kill()
            Write-Host "::error::nyx_selftest_inject_fls TIMEOUT (45s) — remote FlsAlloc/wait likely hung"
            exit 1
          }
          $code = $p.ExitCode
          Write-Host "nyx_selftest_inject_fls exit: $code (0b$([Convert]::ToString($code,2)))"
          if ($code -ne 7) {
            Write-Host "::error::nyx_selftest_inject_fls expected 7 (0b0111), got $code — check Defender telemetry artifact"
            exit 1
          }
          Write-Host "::notice::FLS callback-inject selftest PASS (mask=7: sacrificial + kernel32 + inject ok)"
          exit 0

      # ---- 08-28 Session-0-safe console selftests (hosted-runnable) ----
      # Same harness as B3/B4: nyx-bof-isolated-probe LoadLibrary + direct
      # export call (no rundll32 — Session 0 never reaches rundll32 exports).
      # Reuses the probe EXE built in the B3 step and the selftest implant DLL
      # from the implant build step. CRT3 sleeper is deployed before B4, so
      # inject_pool must find a worker factory — exit 9 is a product FAIL.
      #   vad / inject_threadless / fluctuation: expect 7 (0b0111)
      #   inject_pool: 3 pass (bit0 spawn + bit1 Pool Party ok). 7 was a
      #     mistaken "all bits" that included WARN bit2. 9 no factory FAIL;
      #     5 WARN-degrade FAIL. Hosted 52df502: exit 3 + "Pool Party inject ok".
      #   cfgstage: unpatched CI template first byte 0x41 (65); FAIL on
      #             probe 0xE0/0xE1, timeout, or 0x61-0x64 (locate/decrypt/
      #             parse/empty host).
      - name: Hosted console selftests (vad/threadless/fluctuation/pool/cfgstage)
        shell: pwsh
        run: |
          # Anti-sandbox suite may flag the hosted runner as a VM; bypass so
          # the selftests actually execute (same as B4 / the regression step).
          $env:NYX_SKIP_SANDBOX = "1"
          $probe = "target\release\nyx-bof-isolated-probe.exe"
          $dll = "crates\implant-win\target\x86_64-pc-windows-msvc\release\nyx_implant_win.dll"
          if (-not (Test-Path $probe)) { Write-Host "::error::probe exe missing"; exit 1 }
          if (-not (Test-Path $dll)) { Write-Host "::error::implant DLL missing"; exit 1 }

          # Start-Process + explicit timeout (not `&`), same as B4. Do not wrap
          # this in a nested function: pwsh functions do not close over caller
          # locals (see the Live PDB step below). inject_pool waits for remote
          # kernel32 + a 2s settle; a hung wait must not burn the job timeout.
          $failed = @()
          $exports = @(
            "nyx_selftest_vad",
            "nyx_selftest_inject_threadless",
            "nyx_selftest_fluctuation",
            "nyx_selftest_inject_pool",
            "nyx_selftest_cfgstage"
          )
          foreach ($t in $exports) {
            $p = Start-Process $probe -ArgumentList "`"$dll`"",$t -PassThru -WindowStyle Hidden
            # inject_pool: 4s settle + handle-table scan; 60s budget.
            $waitMs = if ($t -eq "nyx_selftest_inject_pool") { 60000 } else { 45000 }
            $p.WaitForExit($waitMs) | Out-Null
            if (-not $p.HasExited) {
              $p.Kill()
              Write-Host ("{0,-32} TIMEOUT" -f $t)
              Write-Host "::error::$t TIMEOUT (45s)"
              $failed += "$t=TIMEOUT"
              continue
            }
            $code = $p.ExitCode
            $bits = if ($code -ge 0) { [Convert]::ToString($code, 2) } else { "neg" }
            Write-Host ("{0} exit: {1} (0b{2} / 0x{1:X})" -f $t, $code, $bits)

            if ($t -eq "nyx_selftest_inject_pool") {
              Write-Host "===== pool markers ($env:TEMP) ====="
              Get-ChildItem $env:TEMP -Filter 'nyx_g6*' -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host ("--- {0} ---" -f $_.Name)
                Get-Content $_.FullName -ErrorAction SilentlyContinue
              }
              Get-ChildItem $env:TEMP -Filter 'nyx_hold_tp.*' -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host ("--- {0} ---" -f $_.Name)
                Get-Content $_.FullName -ErrorAction SilentlyContinue
              }
              if ($code -eq 3) {
                Write-Host "::notice::$t PASS (mask=3: sacrificial + pool party ok)"
              } elseif ($code -eq 9) {
                # Sleeper is deployed; skip means the product still cannot find
                # a worker factory. Fail the job (do not treat 9 as env-skip).
                Write-Host "::error::$t exit 9 (no worker factory / OpenProcess) — CRT3 sleeper is deployed; failing the job"
                $failed += "$t=9"
              } elseif ($code -eq 5) {
                Write-Host "::error::$t exit 5 (WARN degrade to method 2) — Pool Party did not run; failing the job"
                $failed += "$t=5"
              } else {
                Write-Host "::error::$t expected 3 (bit0+bit1 pass); got $code"
                $failed += ("{0}={1}" -f $t, $code)
              }
            } elseif ($t -eq "nyx_selftest_cfgstage") {
              if ($code -eq 65) {
                Write-Host "::notice::$t PASS (0x41 unpatched CI template)"
              } elseif ($code -eq 0xE0) {
                Write-Host "::error::$t LoadLibrary failed (0xE0)"
                $failed += "$t=0xE0"
              } elseif ($code -eq 0xE1) {
                Write-Host "::error::$t export missing (0xE1)"
                $failed += "$t=0xE1"
              } elseif ($code -ge 0x61 -and $code -le 0x64) {
                Write-Host ("::error::{0} stage fail 0x{1:X} (0x61 locate_ct / 0x62 decrypt / 0x63 parse / 0x64 empty host)" -f $t, $code)
                $failed += ("{0}=0x{1:X}" -f $t, $code)
              } else {
                Write-Host ("::error::{0} expected 0x41 (65) unpatched template, got {1} (0x{1:X})" -f $t, $code)
                $failed += ("{0}={1}" -f $t, $code)
              }
            } else {
              if ($code -ne 7) {
                Write-Host "::error::$t expected 7 (0b0111), got $code"
                $failed += ("{0}={1}" -f $t, $code)
              } else {
                Write-Host ("::notice::{0} PASS (mask=7)" -f $t)
              }
            }
          }

          if ($failed.Count -gt 0) {
            Write-Host ("::error::hosted console selftest failures:`n  - " + ($failed -join "`n  - "))
            exit 1
          }
          Write-Host "::notice::hosted console selftests PASS (vad/threadless/fluctuation/pool/cfgstage)"
          # pwsh steps fail on a leftover non-zero LASTEXITCODE even without
          # throw — same trap as B3/B4 (probe expected exits are 7 / 65).
          exit 0

      # ---- 3. Live PDB offset resolution (ground-truth verification) ----
      - name: "Live PDB offset resolution (host's own kernel)"
        shell: pwsh
        run: |
          # Extract the PDB GUID from the host's live ntoskrnl.exe, download
          # the matching PDB from MS symbol server, parse it with our resolver.
          # This verifies _EPROCESS + ETW-TI 4-hop chain extraction on a REAL
          # kernel (no mocked fixtures), proving the PDB walker works for the
          # host's own build (taken from the registry — never hardcoded).
          $resolver = "crates/offset-resolver/target/debug/nyx-offset-resolver.exe"
          if (-not (Test-Path $resolver)) { Write-Host "::error::resolver missing"; exit 1 }
          $hostBuild = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuildNumber
          Write-Host "Host build: $hostBuild"

          # --- Extract the PDB GUID + age from the PE debug directory ---
          # NOTE: the RVA→file-offset helper uses $script: scoping so the inner
          # function can see the outer byte array + section table. A plain
          # `function R2F` would NOT close over $b/$numSec/$secStart (PowerShell
          # functions don't inherit caller locals by default), which was the
          # bug that caused "could not extract PDB GUID" on the first run.
          $b = [IO.File]::ReadAllBytes("C:\Windows\System32\ntoskrnl.exe")
          $script:bytes = $b
          $script:pe = [BitConverter]::ToInt32($b,0x3C)
          $script:numSec = [BitConverter]::ToUInt16($b,$script:pe+6)
          $script:optSz = [BitConverter]::ToUInt16($b,$script:pe+20)
          $script:secStart = $script:pe + 24 + $script:optSz
          function Resolve-FileOffset($rva) {
            for ($i=0; $i -lt $script:numSec; $i++) {
              $s = $script:secStart + $i*40
              $va = [BitConverter]::ToInt32($script:bytes,$s+12)
              $vs = [BitConverter]::ToInt32($script:bytes,$s+8)
              $pr = [BitConverter]::ToInt32($script:bytes,$s+20)
              if ($rva -ge $va -and $rva -lt ($va+$vs)) { return $pr + ($rva - $va) }
            }
            return $rva
          }
          $ddVA = [BitConverter]::ToInt32($b,$script:pe+24+0xA0)
          $ddSize = [BitConverter]::ToInt32($b,$script:pe+24+0xA4)
          $ddOff = Resolve-FileOffset $ddVA
          $guid = $null; $age = 0
          for ($i=0; $i -lt ($ddSize/28); $i++) {
            $e = $ddOff + $i*28
            # IMAGE_DEBUG_TYPE_CODEVIEW = 2 (NOT 6 — that was the bug). The
            # data at PointerToRawData starts with "RSDS" + 16-byte GUID + age.
            if ([BitConverter]::ToInt32($b,$e+12) -eq 2) {
              $cv = [BitConverter]::ToInt32($b,$e+24)
              if ($cv -le 0) { $cv = Resolve-FileOffset ([BitConverter]::ToInt32($b,$e+20)) }
              if ($b[$cv] -eq 0x52 -and $b[$cv+1] -eq 0x53 -and $b[$cv+2] -eq 0x44 -and $b[$cv+3] -eq 0x53) {
                # Build the standard GUID hex (mixed-endian, no dashes) from the
                # PE little-endian bytes via BitConverter. PowerShell 5.1 lacks
                # [Guid]::new(byte[],int), so format each field manually. This
                # matches offset-resolver's format_symserver_guid input format
                # and was verified end-to-end on 17763.1339.
                $d1 = [BitConverter]::ToUInt32($b,$cv+4)
                $d2 = [BitConverter]::ToUInt16($b,$cv+8)
                $d3 = [BitConverter]::ToUInt16($b,$cv+10)
                $guid = ("{0:X8}{1:X4}{2:X4}" -f $d1,$d2,$d3)
                for ($j=12; $j -lt 20; $j++) { $guid += ("{0:X2}" -f $b[$cv+$j]) }
                $age = [BitConverter]::ToInt32($b,$cv+20)
                break
              }
            }
          }
          if (-not $guid) { Write-Host "::error::could not extract PDB GUID"; exit 1 }
          Write-Host "Live ntoskrnl PDB: GUID=$guid AGE=$age"

          & $resolver --guid $guid --age $age --build $hostBuild --out offsets_live.toml 2>&1
          if (Test-Path offsets_live.toml) {
            Write-Host "=== Resolved offsets (live build $hostBuild) ==="
            Get-Content offsets_live.toml
            $content = Get-Content offsets_live.toml -Raw
            if ($content -notmatch "etw_ti\.provider_block_to_enable_info") {
              Write-Host "::warning::ETW-TI ProviderEnableInfo offset missing — PDB walker issue"
            }
          } else {
            Write-Host "::error::PDB resolution produced no TOML"
            exit 1
          }

      - name: Upload offset artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offsets-${{ github.run_id }}
          path: offsets_live.toml
          if-no-files-found: ignore
          retention-days: 30

      # ---- Defender post-mortem ----
      # FLS / threadless / pool inject selftests (and the rest of the evasion
      # stack) run with Defender realtime ON. When any step fails, capture the
      # detection log: a Defender block is a plausible root cause for an
      # inject-selftest mask miss, and the detection name is the EDR signal.
      - name: Defender telemetry (post-mortem)
        if: failure()
        shell: pwsh
        run: |
          $out = "defender-telemetry.txt"
          "=== Get-MpComputerStatus ===" | Out-File $out
          try {
            Get-MpComputerStatus | Format-List | Out-String | Out-File $out -Append
          } catch { "Get-MpComputerStatus failed: $_" | Out-File $out -Append }
          "=== Get-MpThreatDetection ===" | Out-File $out -Append
          try {
            $det = Get-MpThreatDetection
            if ($det) { $det | Format-List | Out-String | Out-File $out -Append }
            else { "(no threat detections recorded)" | Out-File $out -Append }
          } catch { "Get-MpThreatDetection failed: $_" | Out-File $out -Append }
          Get-Content $out

      - name: Upload Defender telemetry
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: defender-telemetry-${{ github.run_id }}
          path: defender-telemetry.txt
          if-no-files-found: ignore
          retention-days: 30
